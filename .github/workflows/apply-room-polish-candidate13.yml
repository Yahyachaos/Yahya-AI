name: Apply room polish candidate 13

on:
  push:
    paths:
      - '.github/workflows/apply-room-polish-candidate13.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/celine/v80-human-videochat-presence
          fetch-depth: 0
      - name: Apply exact floor-only change
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/de/yahya/ai/CelineRoomEnvironmentV80.java')
          s = p.read_text()
          old = '0.64f, 0.44f, 0.28f, 0.62f, 0.45f);'
          new = '0.48f, 0.38f, 0.30f, 0.62f, 0.45f);'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exact old floor factor once, found {count}')
          p.write_text(s.replace(old, new, 1))
      - name: Commit runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/de/yahya/ai/CelineRoomEnvironmentV80.java
          git commit -m 'v80: neutralize floor toward reference'
      - name: Remove applicator and commit cleanup
        run: |
          git rm .github/workflows/apply-room-polish-candidate13.yml
          git commit -m 'ci: remove candidate 13 applicator'
      - name: Push same canonical branch
        run: git push origin HEAD:auto/celine/v80-human-videochat-presence
