name: Import Yahya AI foundation

on:
  push:
    paths:
      - 'YahyaAI-mobile-v1.0-celin-foundation.zip'

permissions:
  contents: write

jobs:
  import-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exact foundation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .foundation-import
          mkdir .foundation-import
          unzip -q YahyaAI-mobile-v1.0-celin-foundation.zip -d .foundation-import
          SRC='.foundation-import/YahyaAI-mobile-v1.0-celin-foundation'
          test -d "$SRC"
          shopt -s dotglob nullglob
          for item in "$SRC"/*; do
            cp -a "$item" ./
          done
          rm -rf .foundation-import
          rm -f .bootstrap

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Baseline: import Yahya AI v1.0 Celin foundation' || exit 0
          git push
