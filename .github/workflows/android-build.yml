name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 30 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            find "${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Java 11 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Verify project structure
        run: bash VERIFY_PROJECT.sh

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 7.5.1

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Compiler diagnostics"
              echo '```text'
              grep -E 'Celine3DView.java|error:|FAILURE:|What went wrong|Execution failed for task' build.log | tail -120 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: Upload Gradle build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yahya-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
