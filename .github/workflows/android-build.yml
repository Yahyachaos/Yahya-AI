name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ci/CELINE_PROGRESS_QUEUE.json'
      - 'AGENTS.md'
      - 'START_HERE.txt'
      - 'ci/work-orders/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'ci/CELINE_PROGRESS_QUEUE.json'
      - 'AGENTS.md'
      - 'START_HERE.txt'
      - 'ci/work-orders/**'
      # Isolated FUTURE-ONLY, non-runtime prototype files. Mixed app/Gradle/release PRs still trigger Android.
      - 'ci/prototypes/**'
      - 'ci/celine_future_memory_recall_contract_test.py'
      - 'tools/voice-lab/**'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main commit SHA to build and optionally publish
        required: true
        type: string
      publish_release:
        description: Publish the tested APK after all gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-scope:
    name: Determine change scope
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.scope.outputs.app_changed }}
      build_required: ${{ steps.scope.outputs.build_required }}
      runtime_fingerprint: ${{ steps.scope.outputs.runtime_fingerprint }}
      reusable_run_id: ${{ steps.scope.outputs.reusable_run_id }}
      reusable_source_sha: ${{ steps.scope.outputs.reusable_source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          lfs: true
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PR_ACTION: ${{ github.event.action }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BEFORE_SHA: ${{ github.event.before }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: bash ci/android-build-scope.sh

  build:
    needs: change-scope
    if: github.event_name == 'workflow_dispatch' || needs.change-scope.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          lfs: true
      - id: runtime
        run: echo "fingerprint=$(bash ci/celine-runtime-fingerprint.sh HEAD)" >> "$GITHUB_OUTPUT"
      - name: Enforce versionCode bump for automatic runtime PRs
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/celine/')
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          CHANGED="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          if ! grep -Eq '^app/src/' <<<"$CHANGED"; then exit 0; fi
          read_code() { grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | head -1; }
          BASE="$(git show "$PR_BASE_SHA:app/build.gradle" | read_code)"
          HEAD="$(git show "$PR_HEAD_SHA:app/build.gradle" | read_code)"
          [ -n "$BASE" ] && [ -n "$HEAD" ] && [ "$HEAD" -gt "$BASE" ] || { echo "versionCode must increase: base=${BASE:-?} head=${HEAD:-?}"; exit 1; }
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Locate Android SDK command-line tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ] || { echo "Android sdkmanager unavailable"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android 30 SDK
        run: |
          set -euo pipefail
          SDKMANAGER="${SDKMANAGER:-$(command -v sdkmanager || true)}"
          [ -x "$SDKMANAGER" ] || { echo "sdkmanager not found"; exit 1; }
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '7.5.1'}
      - run: bash VERIFY_PROJECT.sh
      - run: gradle wrapper --gradle-version 7.5.1
      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee build.log
      - name: Build distinct signed non-debuggable production APK
        run: ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee release-build.log
      - name: Verify production APK, official signer parity and package identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK_ROOT/build-tools/30.0.3/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/30.0.3/apksigner"
          [ -s "$APK" ] && [ -x "$AAPT" ] && [ -x "$APKSIGNER" ] || { echo 'Release APK or Android verifier missing'; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          VERSION_CODE="$(grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' app/build.gradle | grep -oE '[0-9]+' | head -1)"
          grep -Fq "package: name='de.yahya.ai' versionCode='$VERSION_CODE'" <<<"$BADGING" || { echo 'Release package/version mismatch'; exit 1; }
          if grep -q '^application-debuggable' <<<"$BADGING"; then echo 'FATAL: production APK is debuggable'; exit 1; fi
          "$APKSIGNER" verify "$APK" >/dev/null
          mkdir -p "$RUNNER_TEMP/official-v80"
          gh release download v80 --repo "$GITHUB_REPOSITORY" --pattern 'Yahya-AI-v80.apk' --dir "$RUNNER_TEMP/official-v80"
          OLD="$RUNNER_TEMP/official-v80/Yahya-AI-v80.apk"
          [ -s "$OLD" ] || { echo 'Official v80 APK missing'; exit 1; }
          cert() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1; }
          OLD_CERT="$(cert "$OLD")"
          NEW_CERT="$(cert "$APK")"
          [ -n "$OLD_CERT" ] && [ "$OLD_CERT" = "$NEW_CERT" ] || { echo 'FATAL: production signer differs from installed official v80'; exit 1; }
          sha256sum "$APK" > production-apk-sha256.txt
          echo 'PRODUCTION_APK_PACKAGE_VERSION_NONDEBUG_SIGNER_PARITY_PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: |
            build.log
            release-build.log
      - name: Write runtime build metadata
        if: success()
        env:
          FP: ${{ steps.runtime.outputs.fingerprint }}
        run: |
          APK_SHA="$(sha256sum app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')"
          printf '{"schema":1,"runtime_fingerprint":"%s","built_head":"%s","workflow_run_id":"%s","apk_sha256":"%s"}\n' "$FP" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$APK_SHA" > runtime-build.json
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yahya-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload independently verified production release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yahya-ai-production-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload production APK SHA-256
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yahya-ai-production-sha256
          path: production-apk-sha256.txt
      - name: Upload runtime fingerprint metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-fingerprint-${{ steps.runtime.outputs.fingerprint }}
          path: runtime-build.json

  emulator-smoke:
    name: Android emulator avatar visibility
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Locate Android SDK command-line tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ] || { echo "Android sdkmanager unavailable"; exit 1; }
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: {name: yahya-ai-debug, path: ci-apk}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: timeout 240s bash ci/emulator-smoke.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-avatar-visibility-evidence
          path: |
            emulator-*.png
            emulator-*.xml
            emulator-*.txt
          if-no-files-found: ignore

  production-upgrade-smoke:
    name: Exact signed nondebuggable v83 upgrade / Android API ${{ matrix.api-level }}
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@v4
        with: {name: yahya-ai-production-release, path: ci-apk}
      - uses: actions/download-artifact@v4
        with: {name: yahya-ai-production-sha256, path: ci-apk}
      - name: Fetch official installed v80 baseline and bind exact same-run v83 APK digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p production-upgrade-proof
          test -s ci-apk/app-release.apk
          test -s ci-apk/production-apk-sha256.txt
          EXPECTED="$(awk 'NR==1 {print $1}' ci-apk/production-apk-sha256.txt)"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          echo "$EXPECTED  ci-apk/app-release.apk" | sha256sum -c -
          gh release download v80 --repo "$GITHUB_REPOSITORY" --pattern Yahya-AI-v80.apk -D ci-apk
          echo 'b19c123960c22170785db7fd6479482e62b1891e6c495dedfb331b982bba8a58  ci-apk/Yahya-AI-v80.apk' | sha256sum -c -
          printf 'target_sha=%s\nproduction_apk_sha256=%s\n' "$(git rev-parse HEAD)" "$EXPECTED" > production-upgrade-proof/exact-source.txt
      - name: Verify API-specific package version nondebug and historical signer parity
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -x "$SDK_ROOT/build-tools/30.0.3/apksigner" || "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'build-tools;30.0.3'
          AAPT="$SDK_ROOT/build-tools/30.0.3/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/30.0.3/apksigner"
          OLD=ci-apk/Yahya-AI-v80.apk
          NEW=ci-apk/app-release.apk
          "$APKSIGNER" verify --min-sdk-version "${{ matrix.api-level }}" "$OLD"
          "$APKSIGNER" verify --min-sdk-version "${{ matrix.api-level }}" "$NEW"
          "$AAPT" dump badging "$OLD" | grep -F "package: name='de.yahya.ai' versionCode='80'"
          "$AAPT" dump badging "$NEW" | grep -F "package: name='de.yahya.ai' versionCode='83'"
          "$AAPT" dump badging "$NEW" | grep -Fx "sdkVersion:'29'"
          ! "$AAPT" dump badging "$NEW" | grep -q '^application-debuggable'
          cert() { "$APKSIGNER" verify --min-sdk-version "${{ matrix.api-level }}" --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1; }
          test -n "$(cert "$OLD")"
          test "$(cert "$OLD")" = "$(cert "$NEW")"
          echo 'RISK: historical production signer is compromised; parity preserves upgrade compatibility only'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install public v80 then exact same-run v83 and prove HOME starts without OS failure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: |
            set -eu
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '${{ matrix.api-level }}'
            adb install ci-apk/Yahya-AI-v80.apk
            adb shell dumpsys package de.yahya.ai | grep 'versionCode=80'
            adb install -r ci-apk/app-release.apk
            adb shell dumpsys package de.yahya.ai | grep 'versionCode=83'
            adb logcat -c
            adb shell am start -W -n de.yahya.ai/.MainActivity
            sleep 20
            test -n "$(adb shell pidof de.yahya.ai | tr -d '\r')"
            adb shell uiautomator dump /sdcard/production-v83.xml
            adb pull /sdcard/production-v83.xml production-upgrade-proof/home.xml
            adb exec-out screencap -p > production-upgrade-proof/home.png
            adb logcat -d > production-upgrade-proof/logcat.txt
            grep -q 'Mit Celin' production-upgrade-proof/home.xml
            grep -q 'Einstellungen' production-upgrade-proof/home.xml
            ! grep -E 'FATAL EXCEPTION|ANR in de\.yahya\.ai' production-upgrade-proof/logcat.txt
            echo "EXACT_SIGNED_NONDEBUG_V83_API${{ matrix.api-level }}_PASS"
      - name: Upload exact production upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-production-v83-upgrade-api-${{ matrix.api-level }}
          path: production-upgrade-proof/
          if-no-files-found: warn

  publish-release:
    name: Publish in-app update
    # Manual only: a main push can validate but can never self-publish.
    needs: [change-scope, build, emulator-smoke, production-upgrade-smoke]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.publish_release == true &&
      needs.build.result == 'success' && needs.emulator-smoke.result == 'success' &&
      needs.production-upgrade-smoke.result == 'success' &&
      needs.change-scope.result == 'success' && needs.change-scope.outputs.app_changed == 'true' &&
      inputs.target_sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          lfs: true
      - uses: actions/download-artifact@v4
        with: {name: yahya-ai-production-release, path: release-apk}
      - name: Ensure Android 30 build-tools for production guard
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK_ROOT/build-tools/30.0.3/apksigner" ]; then
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'build-tools;30.0.3'
          fi
      - name: Require successful exact-main real V47 DownloadManager-to-Installer proof
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/celine-v83-updater-install-proof.yml/runs?head_sha=$TARGET_SHA&status=success&per_page=100")"
          RUN_ID="$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")][0].id // empty' <<<"$RUNS")"
          test -n "$RUN_ID"
          JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          test "$(jq '[.jobs[] | select(.name == "Original V47 public v79 to v80 / Android API 29" and .conclusion == "success")] | length' <<<"$JOBS")" = 1
          test "$(jq '[.jobs[] | select(.name == "Original V47 public v79 to v80 / Android API 35" and .conclusion == "success")] | length' <<<"$JOBS")" = 1
          echo "EXACT_MAIN_REAL_V47_PREPUBLICATION_PATH_PASS: run=$RUN_ID sha=$TARGET_SHA"
          echo "This proves unchanged production v79 to v80 only; actual v80 to v83 runs after publication."
      - name: Publish and read-back verify exact-version GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
        run: bash ci/publish_release_guard.sh
