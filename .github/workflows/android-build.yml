name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 30 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            find "${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Java 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Verify project structure
        run: bash VERIFY_PROJECT.sh

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 7.5.1

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Compiler diagnostics"
              echo '```text'
              grep -E 'Celine3DView.java|CelineUpdaterV47.java|CelineVideoChatV44.java|YahyaApplication.java|error:|FAILURE:|What went wrong|Execution failed for task' build.log | tail -160 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: Upload Gradle build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yahya-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator-smoke:
    name: Android emulator avatar visibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: yahya-ai-debug
          path: ci-apk

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and prove Celine is rendered
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The app still compiles/targets Android 30. API 35 is used only for the CI renderer.
          # ANGLE avoids both the old SwiftShader GLSL crash and the headless-host GPU stall.
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: timeout 240s bash ci/emulator-smoke.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-avatar-visibility-evidence
          path: |
            emulator-home.png
            emulator-call.png
            emulator-home-return.png
            emulator-window.xml
            emulator-call.xml
            emulator-home-return.xml
            emulator-logcat.txt
            emulator-prefs.xml
          if-no-files-found: ignore

  publish-release:
    name: Publish in-app update
    needs: [build, emulator-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: yahya-ai-debug
          path: release-apk

      - name: Publish or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' app/build.gradle | grep -oE '[0-9]+' | head -1)"
          if [ -z "$VERSION_CODE" ]; then
            echo "Could not determine versionCode"
            exit 1
          fi
          TAG="v${VERSION_CODE}"
          APK_NAME="Yahya-AI-v${VERSION_CODE}.apk"
          cp release-apk/app-debug.apk "$APK_NAME"

          NOTES_FILE="RELEASE_NOTES.md"
          if [ ! -f "$NOTES_FILE" ]; then
            printf 'Automatisch gebauter und im Android-Emulator mit sichtbarem 3D-Avatar geprüfter Yahya-AI-Build.\n' > "$NOTES_FILE"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --title "Yahya AI v${VERSION_CODE}" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "Yahya AI v${VERSION_CODE}" \
              --notes-file "$NOTES_FILE" \
              --target "${GITHUB_SHA}" \
              --latest
          fi

          echo "Published $TAG only after HOME + CALL avatar visibility proof" >> "$GITHUB_STEP_SUMMARY"
