name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 30 SDK
        run: sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Java 8 for legacy Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 6.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.1.1'

      - name: Print changed checksums
        run: |
          sha256sum app/src/main/AndroidManifest.xml
          sha256sum app/src/main/java/de/yahya/ai/CelineAvatarController.java
          sha256sum app/src/main/java/de/yahya/ai/CelineFaceOverlayView.java
          sha256sum app/src/main/java/de/yahya/ai/LocalNeuralTtsEngine.java

      - name: Verify project structure
        run: bash VERIFY_PROJECT.sh

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 6.1.1

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yahya-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
