name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 30 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            find "${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Java 11 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Verify project structure
        run: bash VERIFY_PROJECT.sh

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 7.5.1

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew assembleDebug --console=plain --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying after 20 seconds in case a dependency repository is temporarily unavailable."
              sleep 20
            fi
          done
          exit 1

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yahya-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
