name: Phase 2 speech normalizer refactor

on:
  push:
    branches: [ phase2/speech-normalizer ]
    paths:
      - 'tools/phase2_speech_normalizer.py'

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase2/speech-normalizer

      - name: Apply targeted refactor
        run: python3 tools/phase2_speech_normalizer.py

      - name: Commit targeted refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 2: extract TTS text normalizer'
          git push origin HEAD:phase2/speech-normalizer
