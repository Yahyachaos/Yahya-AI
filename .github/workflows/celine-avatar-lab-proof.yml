name: Celine Avatar Lab Proof

on:
  pull_request:
    branches: [ main ]
    types: [edited]

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-avatar-lab-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  avatar-lab-proof:
    if: contains(github.event.pull_request.body, '[run-avatar-lab-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Locate runtime-equivalent successful Android Build artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          SOURCE_SHA=""
          while read -r candidate_run candidate_sha; do
            [ -n "$candidate_run" ] || continue
            git merge-base --is-ancestor "$candidate_sha" "$PR_HEAD" || continue
            forbidden=""
            while IFS= read -r changed_path; do
              case "$changed_path" in
                ""|ci/CELINE_PROGRESS_QUEUE.json|ci/avatar-lab-proof.sh|.github/workflows/celine-avatar-lab-proof.yml) ;;
                *) forbidden="$changed_path"; break ;;
              esac
            done < <(git diff --name-only "$candidate_sha" "$PR_HEAD")
            [ -z "$forbidden" ] || continue
            RUN_ID="$candidate_run"
            SOURCE_SHA="$candidate_sha"
            break
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/runs?event=pull_request&status=success&per_page=50" --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')

          if [ -z "$RUN_ID" ] || [ -z "$SOURCE_SHA" ]; then
            echo "No successful runtime-equivalent Android Build found for PR head $PR_HEAD"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "Using Android Build run $RUN_ID from runtime-equivalent ancestor $SOURCE_SHA."
            echo "Current proof head is $PR_HEAD; only queue/proof-CI files differ."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download runtime-equivalent APK only
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-apk
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n yahya-ai-debug -D ci-apk
          test -f ci-apk/app-debug.apk
          sha256sum ci-apk/app-debug.apk | tee avatar-lab-apk.sha256

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture deterministic Avatar Lab views
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: timeout 210s bash ci/avatar-lab-proof.sh ci-apk/app-debug.apk avatar-lab-proof

      - name: Upload lightweight Avatar Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-lab-proof-${{ github.event.pull_request.head.sha }}
          path: |
            avatar-lab-proof/
            avatar-lab-apk.sha256
          if-no-files-found: warn
