name: Celine Avatar Lab Proof

on:
  pull_request:
    branches: [ main ]
    types: [edited]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact PR branch head to prove'
        required: true
        type: string
      proof_scope:
        description: 'Bounded proof surface'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - 9r1
          - 9r2
          - 9r3

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-avatar-lab-proof-${{ github.event.pull_request.number || inputs.target_sha || github.ref }}
  cancel-in-progress: true

jobs:
  avatar-lab-proof:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, '[run-avatar-lab-proof]') || contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r1]') || contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r2]') || contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r3]')
    runs-on: ubuntu-latest
    # Exact-head fallback can add a bounded debug build before the emulator evidence chain.
    timeout-minutes: 24
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Locate exact runtime-fingerprint Android Build artifact
        id: source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
        shell: bash
        run: bash ci/celine-find-runtime-apk.sh

      - name: Download runtime-equivalent APK only
        if: steps.source.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-apk
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n yahya-ai-debug -D ci-apk
          test -f ci-apk/app-debug.apk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle for exact-head APK fallback
        if: steps.source.outcome == 'failure'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Build exact proof-head APK fallback
        if: steps.source.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          [ -x "$SDKMANAGER" ] || { echo "sdkmanager not found"; exit 1; }
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3"

          bash VERIFY_PROJECT.sh
          gradle wrapper --gradle-version 7.5.1
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee avatar-lab-fallback-build.log

          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ci-apk
          cp app/build/outputs/apk/debug/app-debug.apk ci-apk/app-debug.apk

      - name: Verify and record exact proof APK provenance
        env:
          FINDER_FP: ${{ steps.source.outputs.runtime_fingerprint }}
          FINDER_OUTCOME: ${{ steps.source.outcome }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f ci-apk/app-debug.apk

          PROOF_HEAD="$(git rev-parse HEAD)"
          CURRENT_FP="$(bash ci/celine-runtime-fingerprint.sh HEAD)"
          APK_SHA="$(sha256sum ci-apk/app-debug.apk | awk '{print $1}')"

          if [ "$FINDER_OUTCOME" = "success" ]; then
            [ -n "$FINDER_FP" ] && [ "$FINDER_FP" = "$CURRENT_FP" ] || {
              echo "Finder/runtime fingerprint mismatch: finder=${FINDER_FP:-missing} current=$CURRENT_FP" >&2
              exit 1
            }
            SOURCE_KIND="android-build-artifact"
          else
            SOURCE_KIND="exact-proof-head-fallback-build"
            SOURCE_RUN_ID=""
            SOURCE_SHA="$PROOF_HEAD"
          fi

          printf '%s  %s\n' "$APK_SHA" 'ci-apk/app-debug.apk' | tee avatar-lab-apk.sha256
          echo "runtime_fingerprint=$CURRENT_FP" | tee avatar-lab-runtime-fingerprint.txt
          {
            echo "source=$SOURCE_KIND"
            echo "proof_head=$PROOF_HEAD"
            echo "source_sha=${SOURCE_SHA:-$PROOF_HEAD}"
            echo "source_run_id=${SOURCE_RUN_ID:-none}"
            echo "runtime_fingerprint=$CURRENT_FP"
            echo "apk_sha256=$APK_SHA"
          } | tee avatar-lab-apk-source.txt

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture requested bounded Avatar Lab evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash ci/celine-avatar-proof-dispatch.sh "${{ github.event_name == 'workflow_dispatch' && inputs.proof_scope || contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r3]') && '9r3' || contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r2]') && '9r2' || contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r1]') && '9r1' || 'full' }}" ci-apk/app-debug.apk avatar-lab-proof

      - name: Fail-closed evidence preflight
        if: success() && !((github.event_name == 'workflow_dispatch' && (inputs.proof_scope == '9r1' || inputs.proof_scope == '9r2' || inputs.proof_scope == '9r3')) || (github.event_name == 'pull_request' && (contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r1]') || contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r2]') || contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r3]'))))
        shell: bash
        run: python3 ci/celine-avatar-proof-preflight.py avatar-lab-proof --report avatar-lab-proof/preflight.json

      - name: Fail-closed 9R.1 evidence preflight
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.proof_scope == '9r1') || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r1]')))
        shell: bash
        run: bash ci/celine-9r1-proof-preflight.sh avatar-lab-proof

      - name: Fail-closed 9R.2 evidence preflight
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.proof_scope == '9r2') || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r2]')))
        shell: bash
        run: |
          set -euo pipefail
          test -s avatar-lab-proof/40-9r2-camera-talk-start.png
          test -s avatar-lab-proof/41-9r2-camera-near-idle.png
          test -s avatar-lab-proof/46-9r2-table-approach-idle.png
          test -s avatar-lab-proof/52-9r2-table-lean-stable.png
          test -s avatar-lab-proof/53-9r2-table-lean-hold.png
          test -s avatar-lab-proof/55-9r2-camera-talk-final.png
          grep -Fq 'PASS 9R.2 camera/table technical gate' avatar-lab-proof/9r2-summary.txt
          grep -Fq 'V80-480' avatar-lab-proof/9r2-runtime-log.txt
          grep -Fq 'handContact=false' avatar-lab-proof/9r2-runtime-log.txt
          grep -Fq 'V80-477' avatar-lab-proof/9r2-runtime-log.txt

      - name: Fail-closed 9R.3 evidence preflight
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.proof_scope == '9r3') || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[run-avatar-lab-proof:9r3]')))
        shell: bash
        run: |
          set -euo pipefail
          test -s avatar-lab-proof/60-9r3-camera-talk-start.png
          test -s avatar-lab-proof/61-9r3-bed-approach-arrived.png
          test -s avatar-lab-proof/64-9r3-edge-sit-stable.png
          test -s avatar-lab-proof/68-9r3-relax-stable.png
          test -s avatar-lab-proof/72-9r3-lie-stable.png
          test -s avatar-lab-proof/76-9r3-sit-up-relax-stable.png
          test -s avatar-lab-proof/80-9r3-edge-sit-return-stable.png
          test -s avatar-lab-proof/84-9r3-stand-exit-stable.png
          test -s avatar-lab-proof/90-9r3-walk-away-arrived.png
          test -s avatar-lab-proof/96-9r3-camera-talk-final.png
          grep -Fq 'PASS 9R.3 bed-chain technical gate' avatar-lab-proof/9r3-summary.txt
          grep -Fq 'pose=BED_EDGE_SIT' avatar-lab-proof/9r3-runtime-log.txt
          grep -Fq 'pose=BED_RELAX' avatar-lab-proof/9r3-runtime-log.txt
          grep -Fq 'pose=BED_LIE' avatar-lab-proof/9r3-runtime-log.txt
          grep -Fq 'pose=STAND_EXIT' avatar-lab-proof/9r3-runtime-log.txt
          grep -Fq 'centralOwner=true' avatar-lab-proof/9r3-runtime-log.txt
          grep -Fq 'V80-477' avatar-lab-proof/9r3-runtime-log.txt

      - name: Upload lightweight Avatar Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-lab-proof-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          path: |
            avatar-lab-proof/
            avatar-lab-apk.sha256
            avatar-lab-runtime-fingerprint.txt
            avatar-lab-apk-source.txt
            avatar-lab-fallback-build.log
          if-no-files-found: warn
