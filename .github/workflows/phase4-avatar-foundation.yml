name: Phase4 Avatar Foundation Patch

on:
  push:
    branches:
      - phase4/avatar-engine-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4/avatar-engine-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused avatar patch
        run: python tools/phase4_avatar_foundation.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 4: route avatar states through controller"
          git push origin HEAD:phase4/avatar-engine-foundation
