name: V58 Self Bump

on:
  push:
    branches: [ 'auto/celine/v58-shoulder-presence' ]
    paths:
      - '.github/workflows/v58-self-bump.yml'

permissions:
  contents: write

jobs:
  bump-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/celine/v58-shoulder-presence
          fetch-depth: 0
      - name: Bump version and remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          old='versionCode 57'
          new='versionCode 58'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/v58-self-bump.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle
          git commit -m 'v58: bump version for shoulder presence'
          git push origin HEAD:auto/celine/v58-shoulder-presence
