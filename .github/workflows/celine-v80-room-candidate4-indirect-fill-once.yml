name: Celine v80 room candidate4 indirect fill once

on:
  push:
    branches:
      - auto/celine/v80-human-videochat-presence
    paths:
      - .github/workflows/celine-v80-room-candidate4-indirect-fill-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: auto/celine/v80-human-videochat-presence
          fetch-depth: 0

      - name: Apply bounded Candidate 4 indirect fill
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/de/yahya/ai/Celine3DView.java')
          text = path.read_text(encoding='utf-8')
          old = '''        indirectLight = new IndirectLight.Builder()\n                .irradiance(1, new float[]{1.0f, 0.82f, 0.68f})\n                .intensity(3000.0f)\n                .build(engine);'''
          new = '''        indirectLight = new IndirectLight.Builder()\n                .irradiance(1, new float[]{1.0f, 0.94f, 0.88f})\n                .intensity(5000.0f)\n                .build(engine);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Candidate #3 indirect-light anchor, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/celine-v80-room-candidate4-indirect-fill-once.yml

      - name: Commit bounded Candidate 4 runtime change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/yahya/ai/Celine3DView.java .github/workflows/celine-v80-room-candidate4-indirect-fill-once.yml
          git commit -m "v80: brighten neutral indirect room fill"
          git push origin HEAD:auto/celine/v80-human-videochat-presence
