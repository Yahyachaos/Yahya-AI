name: Celine Real Candidate Render Proof

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ci/check-real-celine-render.py'
      - 'ci/check-celine-person-presence.py'
      - 'ci/check-camera-zoom-range.py'
      - 'ci/celine-real-candidate-emulator-proof.sh'
      - 'ci/celine-camera-zoom-emulator-proof.sh'
      - '.github/workflows/celine-real-candidate-render-proof.yml'
      - 'app/src/main/assets/models/celine-source/**'
      - 'ci/celine_facial_morph_prototype.py'
      - 'ci/celine_production_morph_v65.py'
      - 'ci/celine_character_refresh_v75.py'
      - 'ci/celine_character_refresh_validation_v75.py'
      - 'ci/celine_material_regions_v75.py'
      - 'ci/celine_material_regions_validation_v75.py'
      - 'docs/celine/reference/v2/REFERENCE_MANIFEST.json'
      - 'ci/celine_true_face_runtime_contract.py'
      - 'ci/celine_a_pose_runtime_contract.py'
      - 'ci/celine_seated_call_runtime_contract.py'
      - 'ci/celine_feminine_presence_runtime_contract.py'
      - 'app/src/main/java/de/yahya/ai/CelineFemininePresenceV71.java'
      - 'app/src/main/java/de/yahya/ai/CelineFemininePresenceV72.java'
      - 'ci/celine_v72_blender_pose_manifest.json'
      - 'app/src/main/java/de/yahya/ai/CelineNaturalBodyMotionV73.java'
      - 'ci/celine_v73_blender_motion_manifest.json'
      - 'app/src/main/java/de/yahya/ai/CelineArmHandPresenceV74.java'
      - 'ci/celine_v74_blender_arm_hand_manifest.json'
      - 'app/src/main/java/de/yahya/ai/CelineSeatedCallV70.java'
      - 'app/src/main/java/de/yahya/ai/CelineCameraZoomV70.java'
      - 'app/src/main/java/de/yahya/ai/CelineArmPoseV69.java'
      - 'app/src/main/java/de/yahya/ai/YahyaApplication.java'
      - 'ci/celine_facial_morph_validation.py'
      - 'app/src/main/java/de/yahya/ai/CelineMorphRuntimeV62.java'
      - 'app/src/main/java/de/yahya/ai/CelineTexturePipelineV39.java'
      - 'app/src/main/java/de/yahya/ai/CelineMeshyRigScaleV61.java'
      - 'app/build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-candidate-proof:
    name: Real Celine HOME CALL identity lifecycle proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision with Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify canonical Celine source
        run: bash ci/verify-celine-source.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and structurally validate exact production candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p morph-proof
          SOURCE='app/src/main/assets/models/celine-source/Meshy_AI_biped_Character_output.glb'
          python ci/celine_production_morph_v65.py "$SOURCE" morph-proof/celine_v65_intermediate.glb \
            --report morph-proof/v65-production-report.json \
            --expected-sha256 6e507144afa22f0534be0419884932a0c6aaa16b8b2013580013ffe5056bb146
          python ci/celine_facial_morph_validation.py "$SOURCE" morph-proof/celine_v65_intermediate.glb --report morph-proof/v65-validation-report.json
          python ci/celine_character_refresh_v75.py "$SOURCE" morph-proof/celine_v65_intermediate.glb morph-proof/celine_v75_geometry.glb \
            --report morph-proof/v75-character-refresh-report.json \
            --expected-sha256 39cbe7f727dd2a63807cd8afece381f7d98599cce88a71151999d6340e65b21d
          python ci/celine_character_refresh_validation_v75.py "$SOURCE" morph-proof/celine_v65_intermediate.glb morph-proof/celine_v75_geometry.glb \
            docs/celine/reference/v2/REFERENCE_MANIFEST.json \
            --report morph-proof/v75-validation-report.json \
            --expected-sha256 39cbe7f727dd2a63807cd8afece381f7d98599cce88a71151999d6340e65b21d
          python ci/celine_material_regions_v75.py morph-proof/celine_v75_geometry.glb morph-proof/celine_v75_candidate.glb \
            --report morph-proof/v75-material-regions-report.json
          python ci/celine_material_regions_validation_v75.py morph-proof/celine_v75_geometry.glb morph-proof/celine_v75_candidate.glb \
            --report morph-proof/v75-material-validation-report.json
          python ci/celine_true_face_runtime_contract.py
          python ci/celine_a_pose_runtime_contract.py
          python ci/celine_seated_call_runtime_contract.py
          python ci/celine_feminine_presence_runtime_contract.py
          echo "candidate_sha256=$(sha256sum morph-proof/celine_v75_candidate.glb | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 30 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Build guarded v75 character refresh APK
        shell: bash
        run: |
          set -euo pipefail
          bash VERIFY_PROJECT.sh
          gradle wrapper --gradle-version 7.5.1
          ./gradlew assembleDebug --console=plain

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and prove real candidate across HOME CALL HOME plus zoom bounds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: timeout 300s bash -lc 'bash ci/celine-real-candidate-emulator-proof.sh app/build/outputs/apk/debug/app-debug.apk morph-proof/celine_v75_candidate.glb && bash ci/celine-camera-zoom-emulator-proof.sh'

      - name: Upload real candidate visual/identity/lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celine-real-candidate-render-evidence
          path: |
            morph-proof/v65-production-report.json
            morph-proof/v65-validation-report.json
            morph-proof/v75-character-refresh-report.json
            morph-proof/v75-validation-report.json
            morph-proof/v75-material-regions-report.json
            morph-proof/v75-material-validation-report.json
            real-candidate-home.png
            real-candidate-call.png
            real-candidate-home-return.png
            real-candidate-zoom-far.png
            real-candidate-zoom-default.png
            real-candidate-zoom-near.png
            real-candidate-home.xml
            real-candidate-call.xml
            real-candidate-home-return.xml
            real-candidate-logcat-home.txt
            real-candidate-logcat-final.txt
            real-candidate-zoom-logcat.txt
            real-candidate-logcat.txt
            real-candidate-prefs.xml
          if-no-files-found: ignore
          retention-days: 30

# Retrigger exact-head proof after the prior hosted-runner queue stalled without creating a job.
