name: Celine Room Runtime GLB Profile

on:
  pull_request:
    types: [synchronize, edited]
    paths:
      - '.github/workflows/celine-room-runtime-glb-profile.yml'
      - 'tools/celine-room-glb-profile.py'
      - 'app/src/main/assets/models/room/source-fidelity/room_plant_small.glb'
      - 'ci/celine_room_small_plant_derived_audit.py'
      - 'ci/celine_room_window_source_derived_pbr_audit.py'
      - 'ci/celine_room_window_atlas_uv_audit.py'
      - 'ci/celine_room_rug_source_derived_audit.py'
      - 'app/src/main/assets/models/room/source-fidelity/room_rug.glb'
      - 'app/src/main/assets/models/room/source-fidelity/room_window_drapes.glb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celine-room-runtime-glb-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-room-glb-profile:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 111)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Profile committed runtime room GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-room-runtime-profile
          python3 tools/celine-room-glb-profile.py \
            app/src/main/assets/models/room/source-fidelity/room_plant_small.glb \
            --output ci-room-runtime-profile/runtime-room-glb-profile.json \
            | tee ci-room-runtime-profile/profile.log
          grep -F 'CELINE_ROOM_GLB_PROFILE PASS' ci-room-runtime-profile/profile.log
          test -s ci-room-runtime-profile/runtime-room-glb-profile.json
          printf '%s\n' "head_sha=${{ github.event.pull_request.head.sha || github.sha }}" > ci-room-runtime-profile/metadata.txt
          printf '%s\n' 'source_small_plant_reference_triangles=2897712' >> ci-room-runtime-profile/metadata.txt
          printf '%s\n' 'source_reference_proof_run=34223747816' >> ci-room-runtime-profile/metadata.txt
          printf '%s\n' 'source_glbs_mutated=false' >> ci-room-runtime-profile/metadata.txt
          printf '%s\n' 'visual_acceptance=not_applicable_profile_only' >> ci-room-runtime-profile/metadata.txt

      - name: Materialize pinned original small plant (no original mutation)
        shell: bash
        run: |
          set -euo pipefail
          PINNED='df50816187978cbf5faf818ad484c3f682be7588'
          DEST='/tmp/celine-small-plant-source'
          git fetch --no-tags origin "$PINNED"
          rm -rf "$DEST"
          git worktree add --detach "$DEST" "$PINNED"
          git -C "$DEST" lfs install --local
          git -C "$DEST" lfs pull --include='app/src/main/assets/models/möbel/Kleinepflanzemittopf.glb' --exclude=''
          SOURCE="$DEST/app/src/main/assets/models/möbel/Kleinepflanzemittopf.glb"
          test "$(stat -c '%s' "$SOURCE")" -eq 177155676
          printf '%s  %s\n' 'ccccb315902611f9a0c5b569e910784de16939486548acee200fae2578c3ab20' "$SOURCE" | sha256sum -c -

      - name: Audit actual packaged small plant against canonical original
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/celine_room_small_plant_derived_audit.py \
            --source /tmp/celine-small-plant-source/app/src/main/assets/models/möbel/Kleinepflanzemittopf.glb \
            --derived app/src/main/assets/models/room/source-fidelity/room_plant_small.glb \
            --output ci-room-runtime-profile/small-plant-source-derived.json \
            | tee ci-room-runtime-profile/small-plant-source-derived.log
          grep -F 'CELINE_ROOM_SMALL_PLANT_STRUCTURAL_AUDIT PASS' ci-room-runtime-profile/small-plant-source-derived.log
          grep -F 'visualAcceptance=UNASSESSED' ci-room-runtime-profile/small-plant-source-derived.log
          test -s ci-room-runtime-profile/small-plant-source-derived.json

      - name: Materialize pinned original window-drapes source (no original mutation)
        shell: bash
        run: |
          set -euo pipefail
          DEST='/tmp/celine-small-plant-source'
          git -C "$DEST" lfs pull --include='app/src/main/assets/models/möbel/Fenstermitgardinen.glb' --exclude=''
          SOURCE="$DEST/app/src/main/assets/models/möbel/Fenstermitgardinen.glb"
          test "$(stat -c '%s' "$SOURCE")" -eq 127167492
          printf '%s  %s\n' '24017a81193d1a55355f152ee491ad517de367446ae8639e346763823fcb231c' "$SOURCE" | sha256sum -c -

      - name: Audit actual packaged window geometry and PBR against canonical original
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/celine_room_window_source_derived_pbr_audit.py \
            --source /tmp/celine-small-plant-source/app/src/main/assets/models/möbel/Fenstermitgardinen.glb \
            --derived app/src/main/assets/models/room/source-fidelity/room_window_drapes.glb \
            --output ci-room-runtime-profile/window-source-derived-pbr.json \
            | tee ci-room-runtime-profile/window-source-derived-pbr.log
          grep -F 'CELINE_ROOM_WINDOW_SOURCE_DERIVED_PBR_AUDIT PASS' ci-room-runtime-profile/window-source-derived-pbr.log
          grep -F 'visualAcceptance=NOT_TESTED' ci-room-runtime-profile/window-source-derived-pbr.log
          test -s ci-room-runtime-profile/window-source-derived-pbr.json

      - name: Audit canonical-vs-packaged window atlas UV and embedded JPEGs (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/celine-window-atlas-audit-env
          /tmp/celine-window-atlas-audit-env/bin/python -m pip install --quiet 'Pillow==11.3.0'
          /tmp/celine-window-atlas-audit-env/bin/python ci/celine_room_window_atlas_uv_audit.py \
            --source /tmp/celine-small-plant-source/app/src/main/assets/models/möbel/Fenstermitgardinen.glb \
            --derived app/src/main/assets/models/room/source-fidelity/room_window_drapes.glb \
            --output-dir ci-room-runtime-profile/ \
            | tee ci-room-runtime-profile/window-atlas-uv-audit.log
          grep -F 'CELINE_ROOM_WINDOW_ATLAS_UV_AUDIT PASS' ci-room-runtime-profile/window-atlas-uv-audit.log
          grep -F 'visualAcceptance=NOT_TESTED' ci-room-runtime-profile/window-atlas-uv-audit.log
          test -s ci-room-runtime-profile/window-atlas-uv-audit.json
          test -s ci-room-runtime-profile/window-atlas-contact-sheet.png

      - name: Materialize pinned canonical rug without source mutation
        shell: bash
        run: |
          set -euo pipefail
          DEST='/tmp/celine-small-plant-source'
          git -C "$DEST" lfs pull --include='app/src/main/assets/models/möbel/Teppisch.glb' --exclude=''
          SOURCE="$DEST/app/src/main/assets/models/möbel/Teppisch.glb"
          test "$(stat -c '%s' "$SOURCE")" -eq 189246808
          printf '%s  %s\n' '5eeb78072d2e059bc9b75434464c6b3d6ee0965d17e55fe333006638d17ab24b' "$SOURCE" | sha256sum -c -

      - name: Audit pinned original versus packaged rug mesh UV PBR
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/celine_room_rug_source_derived_audit.py \
            --source /tmp/celine-small-plant-source/app/src/main/assets/models/möbel/Teppisch.glb \
            --derived app/src/main/assets/models/room/source-fidelity/room_rug.glb \
            --budget-generator tools/blender/apply_celine_room_source_fidelity_budget.py \
            --output ci-room-runtime-profile/rug-source-derived-audit.json \
            | tee ci-room-runtime-profile/rug-source-derived-audit.log
          grep -F 'CELINE_ROOM_RUG_SOURCE_DERIVED_AUDIT PASS' ci-room-runtime-profile/rug-source-derived-audit.log
          grep -F 'visualAcceptance=NOT_TESTED' ci-room-runtime-profile/rug-source-derived-audit.log
          test -s ci-room-runtime-profile/rug-source-derived-audit.json

      - name: Upload runtime room GLB profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celine-room-runtime-glb-profile
          path: ci-room-runtime-profile/
          if-no-files-found: warn
          retention-days: 30
