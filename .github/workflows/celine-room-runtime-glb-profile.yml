name: Celine Room Runtime GLB Profile

on:
  pull_request:
    types: [synchronize, edited]
    paths:
      - '.github/workflows/celine-room-runtime-glb-profile.yml'
      - 'tools/celine-room-glb-profile.py'
      - 'app/src/main/assets/models/room/source-fidelity/room_plant_small.glb'
      - 'ci/celine_room_small_plant_derived_audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celine-room-runtime-glb-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-room-glb-profile:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 111)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Profile committed runtime room GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-room-runtime-profile
          python3 tools/celine-room-glb-profile.py \
            app/src/main/assets/models/room/source-fidelity/room_plant_small.glb \
            --output ci-room-runtime-profile/runtime-room-glb-profile.json \
            | tee ci-room-runtime-profile/profile.log
          grep -F 'CELINE_ROOM_GLB_PROFILE PASS' ci-room-runtime-profile/profile.log
          test -s ci-room-runtime-profile/runtime-room-glb-profile.json
          printf '%s\n' "head_sha=${{ github.event.pull_request.head.sha || github.sha }}" > ci-room-runtime-profile/metadata.txt
          printf '%s\n' 'source_small_plant_reference_triangles=2897712' >> ci-room-runtime-profile/metadata.txt
          printf '%s\n' 'source_reference_proof_run=34223747816' >> ci-room-runtime-profile/metadata.txt
          printf '%s\n' 'source_glbs_mutated=false' >> ci-room-runtime-profile/metadata.txt
          printf '%s\n' 'visual_acceptance=not_applicable_profile_only' >> ci-room-runtime-profile/metadata.txt

      - name: Materialize pinned original small plant (no original mutation)
        shell: bash
        run: |
          set -euo pipefail
          PINNED='df50816187978cbf5faf818ad484c3f682be7588'
          DEST='/tmp/celine-small-plant-source'
          git fetch --no-tags origin "$PINNED"
          rm -rf "$DEST"
          git worktree add --detach "$DEST" "$PINNED"
          git -C "$DEST" lfs install --local
          git -C "$DEST" lfs pull --include='app/src/main/assets/models/möbel/Kleinepflanzemittopf.glb' --exclude=''
          SOURCE="$DEST/app/src/main/assets/models/möbel/Kleinepflanzemittopf.glb"
          test "$(stat -c '%s' "$SOURCE")" -eq 177155676
          printf '%s  %s\n' 'ccccb315902611f9a0c5b569e910784de16939486548acee200fae2578c3ab20' "$SOURCE" | sha256sum -c -

      - name: Audit actual packaged small plant against canonical original
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/celine_room_small_plant_derived_audit.py \
            --source /tmp/celine-small-plant-source/app/src/main/assets/models/möbel/Kleinepflanzemittopf.glb \
            --derived app/src/main/assets/models/room/source-fidelity/room_plant_small.glb \
            --output ci-room-runtime-profile/small-plant-source-derived.json \
            | tee ci-room-runtime-profile/small-plant-source-derived.log
          grep -F 'CELINE_ROOM_SMALL_PLANT_STRUCTURAL_AUDIT PASS' ci-room-runtime-profile/small-plant-source-derived.log
          grep -F 'visualAcceptance=UNASSESSED' ci-room-runtime-profile/small-plant-source-derived.log
          test -s ci-room-runtime-profile/small-plant-source-derived.json

      - name: Upload runtime room GLB profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celine-room-runtime-glb-profile
          path: ci-room-runtime-profile/
          if-no-files-found: warn
          retention-days: 30
