name: Phase 3 Supertonic model manager patch

on:
  push:
    branches: [ phase3/supertonic-model-manager ]
    paths:
      - 'tools/phase3_model_manager.py'

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/supertonic-model-manager
      - run: python3 tools/phase3_model_manager.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 3: add Supertonic model installer'
          git push origin HEAD:phase3/supertonic-model-manager
