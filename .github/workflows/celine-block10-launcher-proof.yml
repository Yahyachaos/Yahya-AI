name: Celine Block 10 Launcher Proof

on:
  push:
    branches: ['auto/celine/v80-human-videochat-presence']
    paths:
      - '.github/workflows/celine-block10-launcher-proof.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/celine-block10-launcher-proof.yml'
      - 'ci/celine-block10-launcher-proof.sh'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/drawable-nodpi/celine_launcher_foreground.jpg'
      - 'app/src/main/res/mipmap-anydpi-v26/**'
      - 'app/src/main/res/mipmap-nodpi/**'
      - 'app/src/main/res/values/colors.xml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-block10-launcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-launcher-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Reuse exact Block 10 APK from Android Build 850
        uses: actions/download-artifact@v4
        with:
          name: yahya-ai-debug
          path: ci-apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33385053463
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capture installed launcher masks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash ci/celine-block10-launcher-proof.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block10-installed-launcher-proof
          path: block10-launcher-proof/
          if-no-files-found: error
