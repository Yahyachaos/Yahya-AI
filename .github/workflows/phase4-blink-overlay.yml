name: Phase 4 Blink Overlay Patch
on:
  push:
    branches:
      - phase4/blink-face-overlay
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[blink-patch-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4/blink-face-overlay
          fetch-depth: 0
      - name: Apply focused avatar wiring patch
        run: python3 tools/phase4_blink_overlay.py
      - name: Commit patch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire natural blink overlay into Celine avatar [blink-patch-done]"
          git push origin HEAD:phase4/blink-face-overlay
