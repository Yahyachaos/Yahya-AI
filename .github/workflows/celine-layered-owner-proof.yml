name: Celine Layered Owner Proof

on:
  pull_request:
    branches: [ main ]
    types: [ edited ]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact PR branch runtime head to prove
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-layered-owner-proof-${{ github.event.pull_request.number || inputs.target_sha || github.ref }}
  cancel-in-progress: true

jobs:
  layered-owner-proof:
    name: Exact HOME CALL Avatar Lab production-owner proof
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.body, '[run-layered-owner-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Verify exact head and structural owner contract
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 ci/celine_layered_owner_runtime_contract.py

      - name: Locate exact runtime-fingerprint Android Build artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
        shell: bash
        run: bash ci/celine-find-runtime-apk.sh

      - name: Download the exact runtime-fingerprint APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          RUNTIME_FP: ${{ steps.source.outputs.runtime_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-apk layered-owner-proof
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n yahya-ai-debug -D ci-apk
          test -f ci-apk/app-debug.apk
          sha256sum ci-apk/app-debug.apk | tee layered-owner-proof/apk.sha256
          printf 'proof_head=%s\nruntime_source_sha=%s\nruntime_fingerprint=%s\nandroid_build_run=%s\n' \
            "$TARGET_SHA" "$SOURCE_SHA" "$RUNTIME_FP" "$RUN_ID" \
            | tee layered-owner-proof/runtime-source.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Prove central owner in product and Avatar Lab production modes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: timeout 300s bash ci/celine-layered-owner-emulator-proof.sh ci-apk/app-debug.apk layered-owner-proof

      - name: Upload exact layered-owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celine-layered-owner-evidence-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          path: layered-owner-proof/
          if-no-files-found: warn
          retention-days: 30
