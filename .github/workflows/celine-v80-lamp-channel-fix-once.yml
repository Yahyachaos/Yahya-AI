name: Celine v80 lamp channel fix once

on:
  push:
    branches:
      - auto/celine/v80-human-videochat-presence
    paths:
      - .github/workflows/celine-v80-lamp-channel-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: auto/celine/v80-human-videochat-presence
          fetch-depth: 0

      - name: Enable Lamp on default renderable light channel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/de/yahya/ai/CelineRoomEnvironmentV80.java')
          text = path.read_text(encoding='utf-8')
          old = '.lightChannel(0, false)'
          new = '.lightChannel(0, true)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one disabled Lamp channel anchor, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/celine-v80-lamp-channel-fix-once.yml

      - name: Commit bounded Lamp channel fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/yahya/ai/CelineRoomEnvironmentV80.java .github/workflows/celine-v80-lamp-channel-fix-once.yml
          git commit -m "fix: enable v80 lamp renderable light channel"
          git push origin HEAD:auto/celine/v80-human-videochat-presence
