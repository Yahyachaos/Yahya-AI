name: Celine v80 room lighting rebalance once

on:
  push:
    branches:
      - auto/celine/v80-human-videochat-presence
    paths:
      - .github/workflows/celine-v80-room-lighting-rebalance-once.yml

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: auto/celine/v80-human-videochat-presence
          fetch-depth: 0

      - name: Apply bounded warm indoor lighting rebalance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/de/yahya/ai/Celine3DView.java')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''        indirectLight = new IndirectLight.Builder()\n                .irradiance(1, new float[]{1.0f, 0.98f, 0.96f})\n                .intensity(7000.0f)\n                .build(engine);''',
                  '''        // v80 room polish: the previous daylight-strength fill clipped the warm shell and\n        // hid the localized floor-lamp state. Keep Celine/camera geometry untouched and move only\n        // the shared scene illumination toward a warm indoor evening baseline.\n        indirectLight = new IndirectLight.Builder()\n                .irradiance(1, new float[]{1.0f, 0.82f, 0.68f})\n                .intensity(3000.0f)\n                .build(engine);'''
              ),
              (
                  '''        new LightManager.Builder(LightManager.Type.DIRECTIONAL)\n                .color(1.0f, 0.96f, 0.92f)\n                .intensity(32000.0f)\n                .direction(-0.28f, -0.55f, -1.0f)''',
                  '''        new LightManager.Builder(LightManager.Type.DIRECTIONAL)\n                .color(1.0f, 0.80f, 0.66f)\n                .intensity(14000.0f)\n                .direction(-0.28f, -0.55f, -1.0f)'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one lighting anchor, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/celine-v80-room-lighting-rebalance-once.yml

      - name: Commit bounded lighting change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/yahya/ai/Celine3DView.java .github/workflows/celine-v80-room-lighting-rebalance-once.yml
          git commit -m "fix: rebalance v80 room ambient lighting"
          git push origin HEAD:auto/celine/v80-human-videochat-presence
