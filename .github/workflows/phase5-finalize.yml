name: Phase 5 Finalize
on:
  push:
    branches: [ phase5/audio-driven-mouth ]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/audio-driven-mouth
      - name: Regenerate project checksums
        run: |
          rm .github/workflows/phase5-finalize.yml
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "PROJECT_CHECKSUMS.txt" ] && continue
            [ "$f" = ".github/workflows/phase5-finalize.yml" ] && continue
            sha256sum "$f"
          done > PROJECT_CHECKSUMS.txt
      - name: Commit finalized Phase 5 tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize audio-driven mouth sync checksums"
          git push origin HEAD:phase5/audio-driven-mouth
