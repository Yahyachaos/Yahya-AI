name: Celine Block 7 Blink Proof

on:
  pull_request:
    branches: [ main ]
    types: [edited]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact PR branch head to prove'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-block7-blink-proof-${{ github.event.pull_request.number || inputs.target_sha || github.ref }}
  cancel-in-progress: true

jobs:
  block7-blink-proof:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body, '[run-block7-blink-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false
      - name: Locate exact runtime-fingerprint Android Build artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
        shell: bash
        run: bash ci/celine-find-runtime-apk.sh
      - name: Download runtime-equivalent APK only
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-apk
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n yahya-ai-debug -D ci-apk
          test -f ci-apk/app-debug.apk
          sha256sum ci-apk/app-debug.apk | tee block7-apk.sha256
          echo "runtime_fingerprint=${{ steps.source.outputs.runtime_fingerprint }}" | tee block7-runtime-fingerprint.txt
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capture exact Block-7 open partial closed reopen evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: timeout 180s bash -lc 'bash ci/celine-block7-blink-emulator-proof.sh ci-apk/app-debug.apk block7-blink-proof'
      - name: Upload Block-7 blink evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celine-block7-blink-evidence-${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha }}
          path: |
            block7-blink-proof/
            block7-apk.sha256
            block7-runtime-fingerprint.txt
          if-no-files-found: warn
