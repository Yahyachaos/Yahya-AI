name: Finalize local TTS diagnostics
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'diagnostics/local-tts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/local-tts
          fetch-depth: 0
      - name: Add diagnostics UI and refresh checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/de/yahya/ai/MainActivity.java')
          s=p.read_text()
          old='''            new AlertDialog.Builder(this).setTitle("Celines lokale Neural-Stimme").setMessage("Das Supertonic-Sprachmodell ist auf diesem Gerät installiert und wird vollständig lokal verwendet. Möchtest du die Stimme testen oder das Modell entfernen?").setPositiveButton("Stimme testen",(d,w)->speak("Hallo Yahya. Ich spreche jetzt vollständig lokal auf deinem Gerät. Wie gefällt dir meine Stimme?")).setNeutralButton("Modell entfernen",(d,w)->{if(localNeuralTts!=null)localNeuralTts.release();supertonicModels.remove();Toast.makeText(this,"Lokales Sprachmodell entfernt.",Toast.LENGTH_SHORT).show();}).setNegativeButton("Schließen",null).show();'''
          new='''            new AlertDialog.Builder(this).setTitle("Celines lokale Neural-Stimme").setMessage("Das Supertonic-Sprachmodell ist auf diesem Gerät installiert. Wenn die Stimme nicht läuft, zeigt Diagnose den genauen Modell- und Runtime-Status.").setPositiveButton("Stimme testen",(d,w)->speak("Hallo Yahya. Ich spreche jetzt vollständig lokal auf deinem Gerät. Wie gefällt dir meine Stimme?")).setNeutralButton("Diagnose",(d,w)->showLocalTtsDiagnostics()).setNegativeButton("Schließen",null).show();'''
          if old not in s: raise SystemExit('installed dialog pattern not found')
          s=s.replace(old,new,1)
          anchor='''    private void installLocalVoice(){'''
          method='''    private void showLocalTtsDiagnostics(){
        if(localNeuralTts==null)return;
        status.setText("Lokale Stimme wird diagnostiziert …");avatarThinking();
        new Thread(()->{String report;try{report=localNeuralTts.diagnosticReport();}catch(Throwable e){report="Diagnosefehler: "+e.getClass().getSimpleName()+": "+e.getMessage();}final String out=report;runOnUiThread(()->{status.setText("Bereit");avatarIdle();TextView tv=new TextView(MainActivity.this);tv.setText(out);tv.setTextColor(text);tv.setTextSize(12);tv.setTextIsSelectable(true);tv.setPadding(dp(16),dp(12),dp(16),dp(12));ScrollView sv=new ScrollView(MainActivity.this);sv.addView(tv);new AlertDialog.Builder(MainActivity.this).setTitle("Lokale Stimme · Diagnose").setView(sv).setPositiveButton("Schließen",null).show();});},"celin-tts-diagnostics").start();
    }

'''
          if anchor not in s: raise SystemExit('install method anchor not found')
          s=s.replace(anchor,method+anchor,1)
          old2='''            @Override public void onError(Throwable error){runOnUiThread(()->{Toast.makeText(MainActivity.this,"Lokale Neural-Stimme noch nicht bereit – Fallback aktiv.",Toast.LENGTH_SHORT).show();speakExistingFallback(clean);});}'''
          new2='''            @Override public void onError(Throwable error){runOnUiThread(()->{String why=localNeuralTts==null?"unbekannt":localNeuralTts.getLastErrorSummary();Toast.makeText(MainActivity.this,"Lokale Stimme: "+why,Toast.LENGTH_LONG).show();speakExistingFallback(clean);});}'''
          if old2 not in s: raise SystemExit('local fallback pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          rm .github/workflows/finalize-local-tts-diagnostics.yml
          git ls-files | grep -v '^PROJECT_CHECKSUMS.txt$' | grep -v '^.github/workflows/finalize-local-tts-diagnostics.yml$' | sort | xargs sha256sum > PROJECT_CHECKSUMS.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Expose on-device diagnostics for local neural TTS'
          git push origin HEAD:diagnostics/local-tts
