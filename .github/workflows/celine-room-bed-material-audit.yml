name: Celine Room Bed Material Audit

on:
  push:
    branches:
      - auto/celine/v80-human-videochat-presence
    paths:
      - .github/workflows/celine-room-bed-material-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Parse room_bed GLB material and extract texture evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, struct
          from pathlib import Path

          path = Path('app/src/main/assets/models/room/celine_room_v80_final_modular.glb')
          data = path.read_bytes()
          if data[:4] != b'glTF':
              raise SystemExit('invalid GLB magic')
          version, declared = struct.unpack_from('<II', data, 4)
          if version != 2 or declared != len(data):
              raise SystemExit(f'invalid GLB header version={version} declared={declared} actual={len(data)}')

          offset = 12
          doc = None
          bin_payload = None
          while offset + 8 <= len(data):
              length, ctype = struct.unpack_from('<II', data, offset)
              offset += 8
              payload = data[offset:offset + length]
              offset += length
              if ctype == 0x4E4F534A:
                  doc = json.loads(payload.rstrip(b'\x00 \t\r\n').decode('utf-8'))
              elif ctype == 0x004E4942:
                  bin_payload = payload
          if doc is None or bin_payload is None:
              raise SystemExit('required GLB chunks missing')

          nodes = doc.get('nodes', [])
          meshes = doc.get('meshes', [])
          materials = doc.get('materials', [])
          textures = doc.get('textures', [])
          images = doc.get('images', [])
          samplers = doc.get('samplers', [])
          buffer_views = doc.get('bufferViews', [])

          matches = [(i, n) for i, n in enumerate(nodes) if n.get('name') == 'room_bed']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one room_bed node, found {len(matches)}')
          node_index, node = matches[0]
          mesh_index = node.get('mesh')
          if not isinstance(mesh_index, int) or not (0 <= mesh_index < len(meshes)):
              raise SystemExit(f'room_bed mesh invalid: {mesh_index}')
          mesh = meshes[mesh_index]
          if len(mesh.get('primitives', [])) != 1:
              raise SystemExit(f'expected exactly one bed primitive, found {len(mesh.get("primitives", []))}')

          primitive = mesh['primitives'][0]
          mi = primitive.get('material')
          if not isinstance(mi, int) or not (0 <= mi < len(materials)):
              raise SystemExit(f'bed material invalid: {mi}')
          mat = materials[mi]
          pbr = mat.get('pbrMetallicRoughness', {})

          evidence_dir = Path('bed-texture-evidence')
          evidence_dir.mkdir(exist_ok=True)

          def tex_info(label, info):
              if not isinstance(info, dict) or 'index' not in info:
                  return None
              ti = info['index']
              out = {'texture_index': ti, 'texCoord': info.get('texCoord', 0)}
              if not (0 <= ti < len(textures)):
                  return out
              tex = textures[ti]
              out['texture'] = tex
              si = tex.get('source')
              if isinstance(si, int) and 0 <= si < len(images):
                  image = images[si]
                  out['image'] = image
                  bv_index = image.get('bufferView')
                  if isinstance(bv_index, int) and 0 <= bv_index < len(buffer_views):
                      bv = buffer_views[bv_index]
                      start = int(bv.get('byteOffset', 0))
                      length = int(bv.get('byteLength', 0))
                      payload = bin_payload[start:start + length]
                      mime = image.get('mimeType', '')
                      ext = '.jpg' if mime == 'image/jpeg' else '.png' if mime == 'image/png' else '.bin'
                      out_path = evidence_dir / f'{label}{ext}'
                      out_path.write_bytes(payload)
                      out['extracted_path'] = str(out_path)
                      out['extracted_bytes'] = len(payload)
                  else:
                      out['extraction_error'] = f'invalid bufferView {bv_index}'
              samp = tex.get('sampler')
              if isinstance(samp, int) and 0 <= samp < len(samplers):
                  out['sampler'] = samplers[samp]
              return out

          report = {
              'glb': {'path': str(path), 'bytes': len(data)},
              'node': {'index': node_index, 'value': node},
              'mesh': {'index': mesh_index, 'name': mesh.get('name'), 'primitive_count': 1},
              'primitive': {
                  'primitive_index': 0,
                  'material_index': mi,
                  'material_name': mat.get('name'),
                  'baseColorFactor': pbr.get('baseColorFactor', [1,1,1,1]),
                  'metallicFactor': pbr.get('metallicFactor', 1),
                  'roughnessFactor': pbr.get('roughnessFactor', 1),
                  'baseColorTexture': tex_info('base_color', pbr.get('baseColorTexture')),
                  'metallicRoughnessTexture': tex_info('metallic_roughness', pbr.get('metallicRoughnessTexture')),
                  'normalTexture': tex_info('normal', mat.get('normalTexture')),
                  'emissiveFactor': mat.get('emissiveFactor', [0,0,0]),
                  'alphaMode': mat.get('alphaMode', 'OPAQUE'),
                  'doubleSided': mat.get('doubleSided', False),
                  'extensions': mat.get('extensions', {})
              }
          }

          out = evidence_dir / 'bed-material-audit.json'
          out.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          for p in sorted(evidence_dir.iterdir()):
              print(f'evidence {p.name} bytes={p.stat().st_size}')
          PY

      - name: Upload audit report and extracted textures
        uses: actions/upload-artifact@v4
        with:
          name: celine-room-bed-texture-evidence
          path: bed-texture-evidence/
          if-no-files-found: error
