name: Celine Auto Merge

on:
  workflow_run:
    workflows: ["Android Build"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: celine-auto-merge
  cancel-in-progress: false

jobs:
  merge-tested-celine-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'auto/celine/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge exact tested PR and continue release pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request is attached to this successful workflow run; nothing to merge."
            exit 0
          fi
          if [ -z "${TESTED_BASE_SHA:-}" ] || [ "$TESTED_BASE_SHA" = "null" ]; then
            echo "Successful run did not expose the tested PR base SHA; refusing an unverifiable merge."
            exit 1
          fi

          PR_JSON="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          MERGED="$(jq -r '.merged' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"
          BASE_REF="$(jq -r '.base.ref' <<<"$PR_JSON")"
          CURRENT_BASE_SHA="$(jq -r '.base.sha' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          CURRENT_HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"

          if [ "$DRAFT" != "false" ]; then
            echo "Refusing to auto-merge draft PR #$PR_NUMBER."
            exit 1
          fi
          if [ "$BASE_REF" != "main" ]; then
            echo "Refusing PR #$PR_NUMBER because base is '$BASE_REF', not main."
            exit 1
          fi
          case "$HEAD_REF" in
            auto/celine/*) ;;
            *)
              echo "Refusing untrusted automatic branch '$HEAD_REF'."
              exit 1
              ;;
          esac
          if [ "$CURRENT_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "PR head changed after the successful Android test; refusing stale merge."
            echo "tested=$EXPECTED_HEAD_SHA current=$CURRENT_HEAD_SHA"
            exit 1
          fi

          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if ! grep -Eq '^(app/src/|app/build.gradle$)' <<<"$FILES"; then
            echo "auto/celine is reserved for product/runtime PRs; this PR has no runtime app change."
            exit 1
          fi

          if [ "$MERGED" = "false" ]; then
            if [ "$STATE" != "open" ]; then
              echo "PR #$PR_NUMBER is closed without merge; refusing continuation."
              exit 1
            fi

            OPEN_AUTOMATIC_PRS="$(gh pr list --repo "$REPO" --state open --base main --limit 100 --json number,headRefName)"
            AUTO_COUNT="$(jq '[.[] | select(.headRefName | startswith("auto/celine/"))] | length' <<<"$OPEN_AUTOMATIC_PRS")"
            ONLY_NUMBER="$(jq -r '[.[] | select(.headRefName | startswith("auto/celine/"))][0].number // empty' <<<"$OPEN_AUTOMATIC_PRS")"
            if [ "$AUTO_COUNT" -ne 1 ] || [ "$ONLY_NUMBER" != "$PR_NUMBER" ]; then
              echo "Refusing merge because exactly one current auto/celine PR must exist."
              echo "count=$AUTO_COUNT expected_pr=$PR_NUMBER found_pr=${ONLY_NUMBER:-none}"
              exit 1
            fi

            MAIN_SHA="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
            if [ "$MAIN_SHA" != "$TESTED_BASE_SHA" ] || [ "$CURRENT_BASE_SHA" != "$TESTED_BASE_SHA" ]; then
              echo "main changed after CI tested this PR; refusing stale merge and requiring a fresh test."
              echo "tested_base=$TESTED_BASE_SHA current_main=$MAIN_SHA current_pr_base=$CURRENT_BASE_SHA"
              exit 1
            fi

            echo "Android Build + HOME/CALL gate passed for head $EXPECTED_HEAD_SHA on unchanged base $TESTED_BASE_SHA."
            gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
            PR_JSON="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          fi

          MERGE_SHA="$(jq -r '.merge_commit_sha // empty' <<<"$PR_JSON")"
          if [ -z "$MERGE_SHA" ]; then
            echo "Could not resolve merge commit for PR #$PR_NUMBER."
            exit 1
          fi

          MERGE_JSON="$(gh api "repos/$REPO/commits/$MERGE_SHA")"
          MERGE_PARENT="$(jq -r '.parents[0].sha // empty' <<<"$MERGE_JSON")"
          if [ "$MERGE_PARENT" != "$TESTED_BASE_SHA" ]; then
            echo "Merged commit is not based on the exact base that CI tested."
            echo "tested_base=$TESTED_BASE_SHA merge_parent=$MERGE_PARENT"
            exit 1
          fi

          MAIN_SHA="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          if [ "$MAIN_SHA" != "$MERGE_SHA" ]; then
            echo "main advanced after the tested merge; refusing to publish a stale commit."
            echo "merge=$MERGE_SHA main=$MAIN_SHA"
            exit 1
          fi

          EXISTING_DISPATCH="$(gh run list --repo "$REPO" --workflow 'Android Build' --event workflow_dispatch --commit "$MERGE_SHA" --limit 20 --json status,conclusion,databaseId 2>/dev/null || printf '[]')"
          if jq -e 'any(.[]; .status == "queued" or .status == "in_progress" or (.status == "completed" and .conclusion == "success"))' <<<"$EXISTING_DISPATCH" >/dev/null; then
            echo "A dispatched Android Build already covers merge $MERGE_SHA; not starting a duplicate."
            exit 0
          fi

          echo "Dispatching exact merge $MERGE_SHA for build + HOME/CALL proof + immutable release."
          gh workflow run android-build.yml \
            --repo "$REPO" \
            --ref main \
            -f target_sha="$MERGE_SHA" \
            -f publish_release=true

          echo "PR #$PR_NUMBER merged from exact tested head and release continuation dispatched for $MERGE_SHA." >> "$GITHUB_STEP_SUMMARY"
