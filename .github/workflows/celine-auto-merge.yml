name: Celine Auto Merge

on:
  workflow_run:
    workflows: ["Android Build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-tested-celine-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'auto/celine/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge exactly the tested Celine PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request is attached to this workflow run; nothing to merge."
            exit 0
          fi

          PR_JSON="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,isDraft,baseRefName,headRefName,headRefOid)"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.isDraft' <<<"$PR_JSON")"
          BASE="$(jq -r '.baseRefName' <<<"$PR_JSON")"
          HEAD="$(jq -r '.headRefName' <<<"$PR_JSON")"
          CURRENT_SHA="$(jq -r '.headRefOid' <<<"$PR_JSON")"

          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is no longer open; nothing to do."
            exit 0
          fi
          if [ "$DRAFT" != "false" ]; then
            echo "Refusing to auto-merge draft PR #$PR_NUMBER."
            exit 1
          fi
          if [ "$BASE" != "main" ]; then
            echo "Refusing to auto-merge PR #$PR_NUMBER because base is '$BASE', not 'main'."
            exit 1
          fi
          case "$HEAD" in
            auto/celine/*) ;;
            *)
              echo "Refusing to auto-merge untrusted branch '$HEAD'."
              exit 1
              ;;
          esac
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "PR head changed after the successful test run; refusing stale merge."
            echo "tested=$EXPECTED_SHA current=$CURRENT_SHA"
            exit 1
          fi

          MAIN_BEFORE="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          COMPARE_STATUS="$(gh api "repos/$REPO/compare/$MAIN_BEFORE...$CURRENT_SHA" --jq '.status')"
          if [ "$COMPARE_STATUS" != "ahead" ] && [ "$COMPARE_STATUS" != "identical" ]; then
            echo "PR head is not based on current main ($MAIN_BEFORE); refreshing branch before merge."
            gh pr update-branch "$PR_NUMBER" --repo "$REPO" --rebase
            echo "Branch refreshed. A new Android Build must pass for the new head before merge."
            exit 0
          fi

          MAIN_AFTER="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$MAIN_AFTER" != "$MAIN_BEFORE" ]; then
            echo "main moved during verification ($MAIN_BEFORE -> $MAIN_AFTER); refusing race-prone merge."
            exit 1
          fi

          echo "Android Build + emulator gate passed for exact head $CURRENT_SHA on current main $MAIN_BEFORE; merging PR #$PR_NUMBER."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
