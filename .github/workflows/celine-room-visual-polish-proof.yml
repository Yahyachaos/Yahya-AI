name: Celine Room Visual Polish Proof

on:
  pull_request:
    branches: [ main ]
    types: [ edited ]

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-room-visual-polish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  room-visual-polish-proof:
    name: Warm room HOME CALL HOME visual proof
    if: contains(github.event.pull_request.body, '[run-room-polish-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: false

      - name: Locate runtime-equivalent Android APK
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: bash ci/celine-find-runtime-apk.sh

      - name: Download runtime-equivalent APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RUNTIME_FP: ${{ steps.source.outputs.runtime_fingerprint }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-apk room-polish-proof
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n yahya-ai-debug -D ci-apk
          test -f ci-apk/app-debug.apk
          sha256sum ci-apk/app-debug.apk | tee room-polish-proof/apk.sha256
          printf 'proof_head=%s\nruntime_source_sha=%s\nruntime_fingerprint=%s\nandroid_build_run=%s\n' \
            "$TARGET_SHA" "$SOURCE_SHA" "$RUNTIME_FP" "$RUN_ID" \
            | tee room-polish-proof/runtime-source.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture targeted warm-room evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: |
            set -euo pipefail
            OUT=room-polish-proof
            APK=ci-apk/app-debug.apk
            PACKAGE=de.yahya.ai
            MAIN=de.yahya.ai/.MainActivity

            fail() {
              echo "room visual polish proof ERROR: $*" >&2
              adb logcat -d | grep -E 'de\.yahya\.ai|FATAL EXCEPTION|SIGABRT|OutOfMemory|ROOM-|V80-|CTL-' | tail -300 || true
              exit 1
            }
            wait_log() {
              local needle="$1" label="$2"
              for _ in $(seq 1 75); do
                adb logcat -d | grep -Fq "$needle" && { echo "Ready: $label"; return 0; }
                sleep 1
              done
              fail "timed out waiting for $label ($needle)"
            }
            capture() {
              local name="$1" label="$2"
              adb exec-out screencap -p > "$OUT/$name.png"
              python3 ci/check-real-celine-render.py "$OUT/$name.png" "$label"
              python3 ci/check-celine-person-presence.py "$OUT/$name.png" "$label"
            }

            test -s "$APK" || fail "APK missing"
            adb install -r "$APK" >/dev/null
            adb shell pm clear "$PACKAGE" >/dev/null || fail "clear state"
            adb shell am force-stop "$PACKAGE" || true
            adb logcat -c || true
            adb shell pm grant "$PACKAGE" android.permission.RECORD_AUDIO || true
            adb shell am start -W -n "$MAIN" > "$OUT/activity-start.txt" || fail "HOME launch"
            wait_log 'ROOM-100' 'modular room active'
            wait_log 'ROOM-117' 'warm shell material polish active'
            wait_log 'V80-410' 'HOME layered frame'
            wait_log 'CTL-350' 'canonical Celine visible'
            sleep 2
            adb shell uiautomator dump /sdcard/room-polish-home.xml >/dev/null || fail "HOME UI dump"
            adb pull /sdcard/room-polish-home.xml "$OUT/home.xml" >/dev/null || fail "HOME UI pull"
            capture home ROOM_POLISH_HOME
            grep -q 'Celin 3D Ansicht' "$OUT/home.xml" || fail "HOME 3D stage missing"
            grep -q 'Mit Celin' "$OUT/home.xml" || fail "CALL entry missing"

            read -r TAP_X TAP_Y <<< "$(python3 - "$OUT/home.xml" <<'PY'
            import re, sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            for node in root.iter('node'):
                if 'Mit Celin' not in node.attrib.get('text', ''):
                    continue
                m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
                if m:
                    x1, y1, x2, y2 = map(int, m.groups())
                    print((x1+x2)//2, (y1+y2)//2)
                    raise SystemExit
            raise SystemExit('CALL bounds missing')
            PY
            )"
            adb shell input tap "$TAP_X" "$TAP_Y"
            wait_log 'target=CALL eased=true snap=false' 'HOME to CALL transition'
            wait_log 'V80-420' 'CALL layered frame'
            sleep 2
            capture call ROOM_POLISH_CALL

            adb shell input keyevent 4
            wait_log 'target=HOME eased=true snap=false' 'CALL to HOME transition'
            sleep 2
            capture home-return ROOM_POLISH_HOME_RETURN

            adb logcat -d -v threadtime > "$OUT/logcat.txt"
            grep -Fq 'ROOM-117' "$OUT/logcat.txt" || fail "warm shell diagnostic absent"
            grep -Fq 'ROOM-100' "$OUT/logcat.txt" || fail "room activation absent"
            if grep -Eq 'ROOM-198|ROOM-199|V80-499|REN-399|FATAL EXCEPTION|SIGABRT|OutOfMemoryError' "$OUT/logcat.txt"; then
              fail "room/renderer/lifecycle failure detected"
            fi
            cat > "$OUT/summary.txt" <<'EOF'
            STRUCTURAL_PASS targeted v80 room visual polish proof
            EXPECTED_VISUAL=warm_beige_walls_and_ceiling_warmer_wood_floor
            PROTECTED=canonical_Celine_camera_room_root_furniture_transforms_navigation_lamp
            VISUAL_ACCEPTANCE=manual_review_required
            EOF
            (cd "$OUT" && sha256sum home.png call.png home-return.png logcat.txt runtime-source.txt apk.sha256 summary.txt > evidence-sha256.txt)

      - name: Upload room visual polish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-visual-polish-${{ github.event.pull_request.head.sha }}
          path: room-polish-proof/
          if-no-files-found: warn
          retention-days: 30
