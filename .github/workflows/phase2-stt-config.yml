name: Phase 2 STT German config refactor

on:
  push:
    branches: [ phase2/stt-german-config ]
    paths:
      - 'tools/phase2_stt_config.py'

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase2/stt-german-config

      - name: Apply targeted refactor
        run: python3 tools/phase2_stt_config.py

      - name: Commit targeted refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 2: centralize German STT config'
          git push origin HEAD:phase2/stt-german-config
