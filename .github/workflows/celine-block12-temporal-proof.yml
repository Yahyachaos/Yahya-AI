name: Celine Block 12 Temporal Proof

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/celine-block12-temporal-proof.yml'
      - 'ci/celine-block12-temporal-proof.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-block12-temporal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuous-temporal-proof:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[run-block12-temporal-proof]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Locate runtime-equivalent Android APK
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash ci/celine-find-runtime-apk.sh
      - name: Reuse runtime-equivalent Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p ci-apk
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n yahya-ai-debug -D ci-apk
          test -f ci-apk/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capture continuous production-equivalent v80 temporal sequence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash ci/celine-block12-temporal-proof.sh
      - name: Bind proof metadata to exact runtime-equivalent APK
        if: success()
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RUNTIME_FP: ${{ steps.source.outputs.runtime_fingerprint }}
          BUILD_RUN: ${{ steps.source.outputs.run_id }}
        run: |
          sed -i "s/^RUNTIME_HEAD=.*/RUNTIME_HEAD=${SOURCE_SHA}/" block12-temporal-proof/summary.txt
          sed -i "s/^RUNTIME_FINGERPRINT=.*/RUNTIME_FINGERPRINT=${RUNTIME_FP}/" block12-temporal-proof/summary.txt
          printf '%s\n' "APK_BUILD_RUN=${BUILD_RUN}" >> block12-temporal-proof/summary.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block12-temporal-proof
          path: block12-temporal-proof/
          if-no-files-found: error
