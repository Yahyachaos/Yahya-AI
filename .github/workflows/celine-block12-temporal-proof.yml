name: Celine Block 12 Temporal Proof

on:
  push:
    branches: ['auto/celine/v80-human-videochat-presence']
    paths:
      - '.github/workflows/celine-block12-temporal-proof.yml'
      - 'ci/celine-block12-temporal-proof.sh'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/celine-block12-temporal-proof.yml'
      - 'ci/celine-block12-temporal-proof.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-block12-temporal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuous-temporal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Reuse exact Block 12 CALL-transition runtime APK from Android Build 873
        uses: actions/download-artifact@v4
        with:
          name: yahya-ai-debug
          path: ci-apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33415067045
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Capture continuous production-equivalent v80 temporal sequence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash ci/celine-block12-temporal-proof.sh
      - name: Bind proof metadata to exact CALL-transition runtime
        if: success()
        run: |
          sed -i 's/^RUNTIME_HEAD=.*/RUNTIME_HEAD=99d053cc08cffa58691dab8b1697def6ac3f3ea4/' block12-temporal-proof/summary.txt
          sed -i 's/^RUNTIME_FINGERPRINT=.*/RUNTIME_FINGERPRINT=c724a797b0c5faef56ca7df8a8ea2caacfabc9f7207423e15dcc6952ae8b1af7/' block12-temporal-proof/summary.txt
          printf '%s\n' 'APK_BUILD_RUN=33415067045' 'APK_ARTIFACT=9766732364' >> block12-temporal-proof/summary.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block12-temporal-proof
          path: block12-temporal-proof/
          if-no-files-found: error
