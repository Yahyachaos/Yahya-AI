name: Celine Room Partitioned Source-Fidelity Proof

on:
  pull_request:
    types: [synchronize, edited]
    paths:
      - '.github/workflows/celine-room-partitioned-pbr-proof.yml'
      - 'tools/blender/build_celine_room_440x420.py'
      - 'tools/blender/apply_celine_room_source_fidelity_budget.py'
      - 'tools/blender/export_celine_room_partitioned_pbr_recovery.py'
      - 'tools/blender/solve_celine_room_reference_layout_stage.py'
      - 'ci/celine_room_440x420_builder_contract.py'
      - 'ci/evidence/CELINE_ROOM_REFERENCE_LAYOUT_TARGETS.json'
      - 'Refernzbild.png'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-room-partitioned-pbr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  partitioned-source-fidelity:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.body || '', '[run-room-440-blender-proof]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head with LFS support
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Static exact-room contract
        run: python3 ci/celine_room_440x420_builder_contract.py

      - name: Materialize pinned canonical furniture sources
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT='df50816187978cbf5faf818ad484c3f682be7588'
          SOURCE_DIR='/tmp/celine-room-source'
          git fetch --no-tags origin "$SOURCE_COMMIT"
          rm -rf "$SOURCE_DIR"
          git worktree add --detach "$SOURCE_DIR" "$SOURCE_COMMIT"
          git -C "$SOURCE_DIR" lfs install --local
          git -C "$SOURCE_DIR" lfs pull --include='app/src/main/assets/models/möbel/*.glb' --exclude=''
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/celine-room-source/app/src/main/assets/models/möbel')
          files = sorted(base.glob('*.glb'))
          if len(files) != 12:
              raise SystemExit(f'expected 12 materialized source GLBs, got {len(files)}')
          tiny = [(p.name, p.stat().st_size) for p in files if p.stat().st_size < 100_000_000]
          if tiny:
              raise SystemExit(f'unmaterialized source GLBs: {tiny}')
          print('CELINE_ROOM_PARTITION_SOURCE_MATERIALIZE PASS', len(files))
          PY

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 xvfb
          blender --version | head -n 2
          blender --background --factory-startup --python-expr 'import numpy; print("BLENDER_NUMPY_OK", numpy.__version__)'
          command -v xvfb-run

      - name: Reuse exact source witness needed by fidelity reducer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-room-proof
          rm -rf /tmp/celine-room-source-witness
          mkdir -p /tmp/celine-room-source-witness
          gh run download 34240853951 \
            --repo "$GITHUB_REPOSITORY" \
            --name celine-room-440x420-blender-proof \
            --dir /tmp/celine-room-source-witness
          test -s /tmp/celine-room-source-witness/source_front_wide.png
          test -s /tmp/celine-room-source-witness/source_instance_id.png
          test -s /tmp/celine-room-source-witness/render-proof-source.json
          test -s /tmp/celine-room-source-witness/geometry-profile.json
          cp /tmp/celine-room-source-witness/source_front_wide.png ci-room-proof/01_front_wide.png
          cp /tmp/celine-room-source-witness/source_instance_id.png ci-room-proof/02_instance_id.png
          cp /tmp/celine-room-source-witness/render-proof-source.json ci-room-proof/render-proof.json
          cp /tmp/celine-room-source-witness/geometry-profile.json ci-room-proof/geometry-profile.json
          cp Refernzbild.png ci-room-proof/Refernzbild.png
          printf '%s\n' 'source_witness_run=449' > ci-room-proof/source-witness-reuse.txt
          printf '%s\n' 'source_witness_head=2a6f449e5cc284857b0c6d30bd978cd09f2da772' >> ci-room-proof/source-witness-reuse.txt
          printf '%s\n' 'reuse_reason=runtime-equivalent source/layout inputs; this proof isolates the export boundary' >> ci-room-proof/source-witness-reuse.txt

      - name: Reduce solved source scene to proven-clean 4M bracket and export bounded partitions
        shell: bash
        env:
          CELINE_ROOM_GLB_DIR: /tmp/celine-room-source/app/src/main/assets/models/möbel
          CELINE_ROOM_PROOF_DIR: ${{ github.workspace }}/ci-room-proof
          CELINE_ROOM_REFERENCE: ${{ github.workspace }}/Refernzbild.png
          CELINE_ROOM_REFERENCE_TARGETS: ${{ github.workspace }}/ci/evidence/CELINE_ROOM_REFERENCE_LAYOUT_TARGETS.json
          CELINE_ROOM_FIDELITY_BUDGET_SCALE: '0.5'
          CELINE_ROOM_FIDELITY_CHECKPOINT_MODE: skip
          CELINE_ROOM_RECOVERY_TEXTURE_MAX: '1024'
          CELINE_PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # STOP-LOSS strategy switch: runs 451/453/455 proved the single combined GLB
          # export/reload boundary unstable. The same 4M geometry bracket was already
          # visually clean in proof #445. Keep that geometry strategy and change only
          # the export ownership: one shell GLB + one GLB per canonical instance.
          xvfb-run -a blender --background --factory-startup \
            --python-expr 'import bpy; [bpy.data.objects.remove(obj, do_unlink=True) for obj in list(bpy.data.objects) if obj.name in {"Cube", "Camera", "Light"}]' \
            --python tools/blender/build_celine_room_440x420.py \
            --python tools/blender/solve_celine_room_reference_layout_stage.py \
            --python tools/blender/apply_celine_room_source_fidelity_budget.py \
            --python tools/blender/export_celine_room_partitioned_pbr_recovery.py \
            2>&1 | tee ci-room-proof/partitioned-pbr-blender.log

          grep -F 'CELINE_ROOM_440x420 PASS' ci-room-proof/partitioned-pbr-blender.log
          grep -F 'CELINE_ROOM_REFERENCE_SOLVE PASS' ci-room-proof/partitioned-pbr-blender.log
          grep -F 'CELINE_ROOM_SOURCE_FIDELITY_BUDGET PASS' ci-room-proof/partitioned-pbr-blender.log
          grep -F 'CELINE_ROOM_SOURCE_FIDELITY_CHECKPOINT SKIP' ci-room-proof/partitioned-pbr-blender.log
          grep -F 'CELINE_ROOM_PARTITIONED_PBR_EXPORT PASS' ci-room-proof/partitioned-pbr-blender.log
          test -s ci-room-proof/geometry-profile-candidate.json
          test -s ci-room-proof/partitioned-pbr-export.json
          test "$(find ci-room-proof/partitioned-pbr -maxdepth 1 -type f -name '*.glb' | wc -l)" -eq 14
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('ci-room-proof/partitioned-pbr-export.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['partition_count'] == 14, data
          assert data['source_glbs_mutated'] is False, data
          assert data['runtime_promoted'] is False, data
          assert data['total_triangles'] >= 3_000_000, data
          print('CELINE_ROOM_PARTITIONED_PBR_MANIFEST PASS', data['total_triangles'], data['total_glb_bytes'])
          PY
          printf '%s\n' "head_sha=${CELINE_PROOF_HEAD_SHA}" > ci-room-proof/partitioned-pbr-metadata.txt
          printf '%s\n' 'strategy=4M_proven-clean_geometry_partitioned_export_fresh_reload_render' >> ci-room-proof/partitioned-pbr-metadata.txt
          printf '%s\n' 'source_glbs_mutated=false' >> ci-room-proof/partitioned-pbr-metadata.txt
          printf '%s\n' 'runtime_promoted=false' >> ci-room-proof/partitioned-pbr-metadata.txt
          printf '%s\n' 'apk_build_required=false' >> ci-room-proof/partitioned-pbr-metadata.txt

      - name: Fresh-process reload and render partitioned PBR
        shell: bash
        env:
          CELINE_ROOM_PROOF_DIR: ${{ github.workspace }}/ci-room-proof
        run: |
          set -euo pipefail
          cat > /tmp/render_celine_room_partitioned_reload.py <<'PY'
          import json
          import os
          from pathlib import Path

          import bpy
          from mathutils import Vector

          PROOF_DIR = Path(os.environ['CELINE_ROOM_PROOF_DIR']).resolve()
          PART_DIR = PROOF_DIR / 'partitioned-pbr'
          CAMERA_META = PROOF_DIR / 'render-proof.json'
          REFERENCE = PROOF_DIR / 'Refernzbild.png'
          OUTPUT = PROOF_DIR / 'partitioned_reload_front_wide.png'
          META = PROOF_DIR / 'partitioned-pbr-reload-render.json'

          def fail(message):
              print('CELINE_ROOM_PARTITIONED_PBR_RELOAD_RENDER FAIL', flush=True)
              raise RuntimeError(message)

          files = sorted(PART_DIR.glob('*.glb'))
          if len(files) != 14:
              fail(f'expected 14 partition GLBs, got {len(files)}')
          if not CAMERA_META.is_file():
              fail(f'missing camera witness: {CAMERA_META}')
          if not REFERENCE.is_file():
              fail(f'missing reference image: {REFERENCE}')

          for obj in list(bpy.data.objects):
              bpy.data.objects.remove(obj, do_unlink=True)

          imported = []
          for path in files:
              before = set(bpy.data.objects)
              result = bpy.ops.import_scene.gltf(filepath=str(path))
              after = set(bpy.data.objects)
              created = sorted(obj.name for obj in (after - before))
              if 'FINISHED' not in result or not created:
                  fail(f'partition import failed: {path.name} result={result} created={created}')
              imported.append({'file': path.name, 'created_objects': len(created)})
              print(
                  f'CELINE_ROOM_PARTITIONED_PBR_RELOAD_ITEM file={path.name} objects={len(created)}',
                  flush=True,
              )

          camera_payload = json.loads(CAMERA_META.read_text(encoding='utf-8'))['camera']
          camera_data = bpy.data.cameras.new('room_440x420_reference_camera_reload')
          camera = bpy.data.objects.new('room_440x420_reference_camera_reload', camera_data)
          bpy.context.scene.collection.objects.link(camera)
          camera.location = tuple(float(v) for v in camera_payload['location'])
          camera.rotation_euler = tuple(float(v) for v in camera_payload['rotation_euler'])
          camera.data.lens = float(camera_payload['lens_mm'])
          camera['reference_solved'] = True

          scene = bpy.context.scene
          selected_engine = None
          for engine in ('BLENDER_EEVEE_NEXT', 'BLENDER_EEVEE'):
              try:
                  scene.render.engine = engine
                  selected_engine = engine
                  break
              except Exception:
                  continue
          if selected_engine is None:
              fail('no Eevee render engine available')

          scene.render.resolution_x = 1376
          scene.render.resolution_y = 1100
          scene.render.resolution_percentage = 100
          scene.render.image_settings.file_format = 'PNG'
          scene.render.image_settings.color_mode = 'RGB'
          scene.render.image_settings.color_depth = '8'
          scene.render.film_transparent = False
          scene.camera = camera

          world = scene.world
          if world is None:
              world = bpy.data.worlds.new('CELINE_ROOM_PARTITION_RELOAD_WORLD')
              scene.world = world
          world.use_nodes = True
          bg = world.node_tree.nodes.get('Background')
          if bg is not None:
              bg.inputs['Color'].default_value = (0.055, 0.055, 0.055, 1.0)
              bg.inputs['Strength'].default_value = 0.22

          def look_at(obj, target):
              direction = Vector(target) - obj.location
              obj.rotation_euler = direction.to_track_quat('-Z', 'Y').to_euler()

          proof_lights = []
          specs = (
              ('CELINE_PARTITION_RELOAD_KEY', (0.4, 1.45, 2.45), 680.0, 3.4),
              ('CELINE_PARTITION_RELOAD_FILL', (-1.75, 0.15, 1.85), 360.0, 2.8),
              ('CELINE_PARTITION_RELOAD_WINDOW_FILL', (1.25, -1.72, 2.20), 260.0, 2.4),
          )
          for name, location, energy, size in specs:
              data = bpy.data.lights.new(name=name, type='AREA')
              data.energy = energy
              data.shape = 'DISK'
              data.size = size
              data.color = (1.0, 1.0, 1.0)
              obj = bpy.data.objects.new(name, data)
              scene.collection.objects.link(obj)
              obj.location = location
              look_at(obj, (0.0, -0.15, 1.0))
              proof_lights.append(obj)

          front = bpy.data.objects.get('room_shell_front')
          if front is None:
              fail('partition reload missing room_shell_front')
          front.hide_render = True
          front.hide_viewport = True

          scene.render.filepath = str(OUTPUT)
          print(
              f'CELINE_ROOM_PARTITIONED_PBR_RELOAD_RENDER_BEGIN engine={selected_engine} '
              'size=1376x1100 partitions=14 combinedReload=false sourceBytesImmutable=true',
              flush=True,
          )
          bpy.ops.render.render(write_still=True)
          if not OUTPUT.is_file() or OUTPUT.stat().st_size < 20_000:
              fail(f'partition reload render missing or unexpectedly small: {OUTPUT}')

          payload = {
              'schema': 1,
              'purpose': 'fresh-process visual checkpoint for partitioned source-fidelity GLB export after combined-export STOP-LOSS',
              'render': OUTPUT.name,
              'reference': REFERENCE.name,
              'render_size': [1376, 1100],
              'engine': selected_engine,
              'partition_count': len(files),
              'partitions': imported,
              'source_glbs_mutated': False,
              'runtime_promoted': False,
              'combined_glb_reload_used': False,
              'fresh_process_reload_used': True,
              'proof_time_geometry_mutation': False,
              'proof_time_camera_mutation': False,
              'proof_time_neutral_lighting_only': True,
              'camera': {
                  'location': [float(v) for v in camera.location],
                  'rotation_euler': [float(v) for v in camera.rotation_euler],
                  'lens_mm': float(camera.data.lens),
              },
              'visual_acceptance': 'UNASSESSED',
              'note': 'Manual comparison against Refernzbild.png and the clean source-PBR witness is mandatory; structural success cannot accept this raster.',
          }
          META.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print('CELINE_ROOM_PARTITIONED_PBR_RELOAD_RENDER PASS', flush=True)
          print(f'output={OUTPUT}', flush=True)
          print('visualAcceptance=UNASSESSED', flush=True)
          PY

          xvfb-run -a blender --background --factory-startup \
            --python /tmp/render_celine_room_partitioned_reload.py \
            2>&1 | tee ci-room-proof/partitioned-pbr-reload.log

          grep -F 'CELINE_ROOM_PARTITIONED_PBR_RELOAD_RENDER PASS' ci-room-proof/partitioned-pbr-reload.log
          test -s ci-room-proof/partitioned_reload_front_wide.png
          test -s ci-room-proof/partitioned-pbr-reload-render.json

      - name: Upload partitioned source-fidelity proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celine-room-partitioned-pbr-proof
          path: ci-room-proof/
          if-no-files-found: warn
          retention-days: 30