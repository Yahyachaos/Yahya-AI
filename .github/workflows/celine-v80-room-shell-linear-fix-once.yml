name: Celine v80 room shell color-space fix once

on:
  push:
    branches:
      - auto/celine/v80-human-videochat-presence
    paths:
      - .github/workflows/celine-v80-room-shell-linear-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: auto/celine/v80-human-videochat-presence
          fetch-depth: 0

      - name: Use linear glTF material factors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/de/yahya/ai/CelineRoomEnvironmentV80.java')
          text = path.read_text(encoding='utf-8')
          old = 'material.setParameter("baseColorFactor", Colors.RgbaType.SRGB,'
          new = 'material.setParameter("baseColorFactor", Colors.RgbaType.LINEAR,'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one shell baseColorFactor color-space anchor, found {count}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/celine-v80-room-shell-linear-fix-once.yml

      - name: Commit bounded room shell color-space fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/yahya/ai/CelineRoomEnvironmentV80.java .github/workflows/celine-v80-room-shell-linear-fix-once.yml
          git commit -m "fix: apply v80 shell factors in linear space"
          git push origin HEAD:auto/celine/v80-human-videochat-presence
