name: Phase 3 local Supertonic integration

on:
  push:
    branches: [ phase3/local-supertonic-engine ]
    paths:
      - 'tools/phase3_local_supertonic.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/local-supertonic-engine
      - run: python3 tools/phase3_local_supertonic.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 3: wire local Supertonic engine with fallback'
          git push origin HEAD:phase3/local-supertonic-engine
