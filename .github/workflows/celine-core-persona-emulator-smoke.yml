name: Celine Core Persona Android Emulator Smoke

on:
  push:
    branches:
      - auto/celine/v80-human-videochat-presence
    paths:
      - '.github/workflows/celine-core-persona-emulator-smoke.yml'
      - 'ci/celine_core_persona_emulator_smoke.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-core-persona-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-built-apk-and-test:
    name: Real combined v83 Room+Core persona UI and AndroidKeyStore persistence
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout existing Room integration PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Verify runtime equivalence with the actual combined v83 Android #1743
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d3f7a6dc47ab50969ba1c436dff9e3ca89e4fed2 HEAD
          git diff --quiet d3f7a6dc47ab50969ba1c436dff9e3ca89e4fed2 HEAD -- app/src/main app/build.gradle gradle.properties gradle libs.versions.toml
          test "$(bash ci/celine-runtime-fingerprint.sh HEAD)" = "e3a2b2e77075ce4cef937fb9b8bc08a004e158a60018893aec76a0f462aa6137"
          echo 'COMBINED_V83_RUNTIME_EQUIVALENCE_PASS: Room and Core integrated Android #1743 unchanged'
          echo 'No Android build or Room build will be started by this workflow.'

      - name: Reuse actual integrated Room+Core Android #1743 APK (no second Gradle build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-apk core-persona-emulator-proof
          gh run download 40438653109 --repo "$GITHUB_REPOSITORY" -n yahya-ai-debug -D ci-apk
          test -f ci-apk/app-debug.apk
          gh run download 40438653109 --repo "$GITHUB_REPOSITORY" -n runtime-fingerprint-e3a2b2e77075ce4cef937fb9b8bc08a004e158a60018893aec76a0f462aa6137 -D ci-apk
          python3 - <<'PY'
          import hashlib, json, pathlib
          metadata=json.loads(pathlib.Path("ci-apk/runtime-build.json").read_text())
          assert metadata["runtime_fingerprint"]=="e3a2b2e77075ce4cef937fb9b8bc08a004e158a60018893aec76a0f462aa6137"
          # GitHub pull_request Android builds may set GITHUB_SHA to the
          # synthetic PR merge commit, not the source PR head_sha. The source
          # head is pinned independently by this exact GitHub run ID, APK
          # checksum, and runtime tree fingerprint. Do not misclassify it.
          import re
          assert re.fullmatch(r"[0-9a-f]{40}", metadata["built_head"])
          print("ANDROID_BUILD_ACTUAL_GITHUB_SHA="+metadata["built_head"])
          print("ANDROID_BUILD_SOURCE_HEAD=d3f7a6dc47ab50969ba1c436dff9e3ca89e4fed2")
          assert str(metadata["workflow_run_id"])=="40438653109"
          with pathlib.Path("ci-apk/app-debug.apk").open("rb") as apk:
              actual=hashlib.file_digest(apk,"sha256").hexdigest()
          assert actual==metadata["apk_sha256"],"built Android APK SHA-256 mismatch"
          print("COMBINED_V83_APK_INTEGRITY_PASS sha256="+actual)
          PY
          sha256sum ci-apk/app-debug.apk > core-persona-emulator-proof/apk-sha256.txt
          echo 'COMBINED_V83_APK_INTEGRITY_PASS'
          # Public released v80 is the actual user's updater baseline, not an Actions debug artifact.
          gh release download v80 --repo "$GITHUB_REPOSITORY" --pattern 'Yahya-AI-v80.apk' -D ci-apk
          test -f ci-apk/Yahya-AI-v80.apk
          echo 'b19c123960c22170785db7fd6479482e62b1891e6c495dedfb331b982bba8a58  ci-apk/Yahya-AI-v80.apk' | sha256sum -c -
          echo 'PINNED_PUBLIC_V80_RELEASE_INTEGRITY_PASS'

      - name: Reuse runner-preinstalled Android SDK (setup-android v3 legacy tools fails)
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          echo 'Avoiding deprecated sdkmanager tools package requested by setup-android@v3.'

      - name: Allow KVM emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Real emulator install, direct commands, encrypted save, restart and exit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          # Emulator 37.2 rejects deprecated angle_indirect and silently falls
          # back to auto/swangle on llvmpipe. Select a supported deterministic
          # software GLES renderer to isolate system_server/UiAutomator ANRs.
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: |
            set -eu
            # Fail closed if official v80 cannot be upgraded in place to integrated v83.
            adb install -r ci-apk/Yahya-AI-v80.apk
            adb shell dumpsys package de.yahya.ai | grep 'versionCode=80'
            echo 'PUBLIC_V80_BASELINE_INSTALLED_PASS'
            timeout 1080s python3 ci/celine_core_persona_emulator_smoke.py

      - name: Upload genuine emulator screenshots and test provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celine-v83-combined-real-emulator-smoke
          path: core-persona-emulator-proof/
          if-no-files-found: warn
