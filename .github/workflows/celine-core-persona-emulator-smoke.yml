name: Celine Core Persona Android Emulator Smoke

on:
  push:
    branches:
      - auto/celine/core-adult-persona-contract
    paths:
      - '.github/workflows/celine-core-persona-emulator-smoke.yml'
      - 'ci/celine_core_persona_emulator_smoke.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-core-persona-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-built-apk-and-test:
    name: Real installed v82 persona UI and AndroidKeyStore persistence
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout existing Core PR only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Reject unbuilt runtime changes since current pinned v82 Android build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 7500822f30b5f4fcbf43c1dd7fc54e85a051297b HEAD)" = 7500822f30b5f4fcbf43c1dd7fc54e85a051297b
          git diff --quiet 7500822f30b5f4fcbf43c1dd7fc54e85a051297b HEAD -- app/src/main app/build.gradle gradle.properties gradle libs.versions.toml
          echo 'RUNTIME_EQUIVALENCE_PASS: only tests/CI since already-built Core runtime head 7500822f'
          echo 'No Android build or Room build will be started by this workflow.'

      - name: Reuse and verify actual prior successful Core APK (no Gradle)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-apk core-persona-emulator-proof
          gh run download 40219218622 --repo "$GITHUB_REPOSITORY" -n yahya-ai-debug -D ci-apk
          test -f ci-apk/app-debug.apk
          gh run download 40219218622 --repo "$GITHUB_REPOSITORY" -n runtime-fingerprint-a51b95829c73501ce6ff1cbeeb7530d89755f989f3237d47db84d09d0c4f8782 -D ci-apk
          python3 - <<'PY'
          import hashlib, json, pathlib
          metadata=json.loads(pathlib.Path("ci-apk/runtime-build.json").read_text())
          assert metadata["runtime_fingerprint"]=="a51b95829c73501ce6ff1cbeeb7530d89755f989f3237d47db84d09d0c4f8782"
          assert metadata["built_head"]=="7500822f30b5f4fcbf43c1dd7fc54e85a051297b"
          assert str(metadata["workflow_run_id"])=="40219218622"
          with pathlib.Path("ci-apk/app-debug.apk").open("rb") as apk:
              actual=hashlib.file_digest(apk,"sha256").hexdigest()
          assert actual==metadata["apk_sha256"],"built Android APK SHA-256 mismatch"
          print("PINNED_V82_APK_INTEGRITY_PASS sha256="+actual)
          PY
          sha256sum ci-apk/app-debug.apk > core-persona-emulator-proof/apk-sha256.txt
          echo 'PINNED_V82_APK_INTEGRITY_PASS'
          # Public released v80 is the actual user's updater baseline, not an Actions debug artifact.
          gh release download v80 --repo "$GITHUB_REPOSITORY" --pattern 'Yahya-AI-v80.apk' -D ci-apk
          test -f ci-apk/Yahya-AI-v80.apk
          echo 'b19c123960c22170785db7fd6479482e62b1891e6c495dedfb331b982bba8a58  ci-apk/Yahya-AI-v80.apk' | sha256sum -c -
          echo 'PINNED_PUBLIC_V80_RELEASE_INTEGRITY_PASS'

      - name: Reuse runner-preinstalled Android SDK (setup-android v3 legacy tools fails)
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          echo 'Avoiding deprecated sdkmanager tools package requested by setup-android@v3.'

      - name: Allow KVM emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Real emulator install, direct commands, encrypted save, restart and exit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu angle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: |
            set -eu
            # Fail closed if the exact public v80 app cannot be upgraded in place to v82.
            adb install -r ci-apk/Yahya-AI-v80.apk
            adb shell dumpsys package de.yahya.ai | grep 'versionCode=80'
            echo 'PUBLIC_V80_BASELINE_INSTALLED_PASS'
            timeout 600s python3 ci/celine_core_persona_emulator_smoke.py

      - name: Upload genuine emulator screenshots and test provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celine-core-v82-real-emulator-smoke
          path: core-persona-emulator-proof/
          if-no-files-found: warn
