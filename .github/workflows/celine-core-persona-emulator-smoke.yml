name: Celine Core Persona Android Emulator Smoke

on:
  push:
    branches:
      - auto/celine/v80-human-videochat-presence
    paths:
      - '.github/workflows/celine-core-persona-emulator-smoke.yml'
      - 'ci/celine_core_persona_emulator_smoke.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: celine-core-persona-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-built-apk-and-test:
    name: Real combined v83 Room+Core persona UI and AndroidKeyStore persistence
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout existing Room integration PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Verify runtime equivalence with the actual combined v83 Android #1774
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 087126d5c29cdb3340469f92231253d0524b2d16 HEAD
          git diff --quiet 087126d5c29cdb3340469f92231253d0524b2d16 HEAD -- app/src/main app/build.gradle gradle.properties gradle libs.versions.toml
          test "$(bash ci/celine-runtime-fingerprint.sh HEAD)" = "0e9c43703160830ae2f54cf0217ac7738ebfd073eafdb453362a62c9861260de"
          echo 'COMBINED_V83_RUNTIME_EQUIVALENCE_PASS: exact Android #1774, same G1/Persona, + #47 focused-Settings GPU-fence guard'
          echo 'No Android build or Room build will be started by this workflow.'

      - name: Reuse actual integrated Room+Core Android #1774 APK (no second Gradle build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-apk core-persona-emulator-proof
          gh run download 40483077448 --repo "$GITHUB_REPOSITORY" -n yahya-ai-debug -D ci-apk
          test -f ci-apk/app-debug.apk
          gh run download 40483077448 --repo "$GITHUB_REPOSITORY" -n runtime-fingerprint-0e9c43703160830ae2f54cf0217ac7738ebfd073eafdb453362a62c9861260de -D ci-apk
          python3 - <<'PY'
          import hashlib, json, pathlib
          metadata=json.loads(pathlib.Path("ci-apk/runtime-build.json").read_text())
          assert metadata["runtime_fingerprint"]=="0e9c43703160830ae2f54cf0217ac7738ebfd073eafdb453362a62c9861260de"
          # GitHub pull_request Android builds may set GITHUB_SHA to the
          # synthetic PR merge commit, not the source PR head_sha. The source
          # head is pinned independently by this exact GitHub run ID, APK
          # checksum, and runtime tree fingerprint. Do not misclassify it.
          import re
          assert re.fullmatch(r"[0-9a-f]{40}", metadata["built_head"])
          print("ANDROID_BUILD_ACTUAL_GITHUB_SHA="+metadata["built_head"])
          print("ANDROID_BUILD_SOURCE_HEAD=087126d5c29cdb3340469f92231253d0524b2d16")
          assert str(metadata["workflow_run_id"])=="40483077448"
          with pathlib.Path("ci-apk/app-debug.apk").open("rb") as apk:
              actual=hashlib.file_digest(apk,"sha256").hexdigest()
          assert actual==metadata["apk_sha256"],"built Android APK SHA-256 mismatch"
          print("COMBINED_V83_APK_INTEGRITY_PASS sha256="+actual)
          PY
          sha256sum ci-apk/app-debug.apk > core-persona-emulator-proof/apk-sha256.txt
          echo 'COMBINED_V83_APK_INTEGRITY_PASS'
          # Public released v80 is the actual user's updater baseline, not an Actions debug artifact.
          gh release download v80 --repo "$GITHUB_REPOSITORY" --pattern 'Yahya-AI-v80.apk' -D ci-apk
          test -f ci-apk/Yahya-AI-v80.apk
          echo 'b19c123960c22170785db7fd6479482e62b1891e6c495dedfb331b982bba8a58  ci-apk/Yahya-AI-v80.apk' | sha256sum -c -
          echo 'PINNED_PUBLIC_V80_RELEASE_INTEGRITY_PASS'

      - name: Reuse runner-preinstalled Android SDK (setup-android v3 legacy tools fails)
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          echo 'Avoiding deprecated sdkmanager tools package requested by setup-android@v3.'

      - name: Allow KVM emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Real emulator install, direct commands, encrypted save, restart and exit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: default
          disable-animations: true
          # #34: direct swiftshader caused a native de.yahya.ai crash on
          # genuine public v80 startup (Android events am_crash Native crash).
          # #32's rejected angle_indirect used fallback swangle successfully
          # through real v80->v83 memory inspection before an OS ANR. Pin that
          # proven baseline renderer explicitly and give system-server/UI a
          # bounded 4-core AVD to test CPU starvation without masking ANRs.
          # Use emulator-runner default 2 vCPUs: #32 seeded exact public v80 successfully; #35/#36 with four cores lost ADB-injected text.
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: |
            set -eu
            # Fail closed if official v80 cannot be upgraded in place to integrated v83.
            # Genuine #40/#41 proved every character in the real v80 EditText,
            # but pixel_2 at 420 dpi exposed only the LAST assistant bubble in
            # its ~125px chat viewport; UiAutomator pruned the earlier user
            # bubble even without our visibility filter. Present enough real
            # chat viewport to inspect BOTH actual on-screen TextViews instead
            # of weakening exact-chat, persisted-memory or OS-ANR assertions.
            # Real #42: 1080x1920 swangle guest suffered 3-6s GPU fences,
            # ~4950ms GPU frames and 12/12 UiAutomator null-root returns
            # AFTER the exact public-v80 memory was successfully seeded.
            # Keep the same ~620x1100 dp layout at 720x1280 physical pixels
            # (185 dpi) while cutting CPU-software-rendered pixels by 69%.
            # This is an emulator-only isolation, NOT an app performance PASS.
            # The exact #1774 newly built APK is pinned; strict full text/memory and OS-ANR checks remain.
            # Confirm this software emulator matches the source renderer's paced hardware predicate.
            adb shell getprop ro.hardware | tee core-persona-emulator-proof/emulator-hardware.txt
            grep -Eq '^(ranchu|goldfish)$' core-persona-emulator-proof/emulator-hardware.txt
            echo 'SOFTWARE_EMULATOR_PACER_TARGET_HARDWARE_PASS'
            adb shell wm size 720x1280
            adb shell wm density 185
            adb shell wm size | grep 'Override size: 720x1280'
            adb shell wm density | grep 'Override density: 185'
            { adb shell wm size; adb shell wm density; } > core-persona-emulator-proof/emulator-geometry.txt
            adb install -r ci-apk/Yahya-AI-v80.apk
            adb shell dumpsys package de.yahya.ai | grep 'versionCode=80'
            echo 'PUBLIC_V80_BASELINE_INSTALLED_PASS'
            timeout 1080s python3 ci/celine_core_persona_emulator_smoke.py

      - name: Upload genuine emulator screenshots and test provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celine-v83-combined-real-emulator-smoke
          path: core-persona-emulator-proof/
          if-no-files-found: warn
