name: Phase 2 TTS routing refactor

on:
  push:
    branches: [ phase2/tts-routing ]
    paths:
      - 'tools/phase2_tts_routing.py'

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase2/tts-routing

      - name: Apply targeted refactor
        run: python3 tools/phase2_tts_routing.py

      - name: Commit targeted refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 2: centralize TTS engine routing'
          git push origin HEAD:phase2/tts-routing
