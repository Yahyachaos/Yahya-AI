apply plugin: 'com.android.application'

def stableDebugKeystore = rootProject.file('signing/yahya-debug.keystore')
def stableDebugKeystoreBase64 = rootProject.file('signing/yahya-debug.keystore.b64')
if (!stableDebugKeystoreBase64.isFile()) {
    throw new GradleException('Missing signing/yahya-debug.keystore.b64')
}
stableDebugKeystore.parentFile.mkdirs()
stableDebugKeystore.bytes = java.util.Base64.getDecoder().decode(stableDebugKeystoreBase64.getText('UTF-8').trim())

def celineV62GeneratedDir = file("$buildDir/generated/source/celineV62")
def celineV62Source = file('src/main/java/de/yahya/ai/Celine3DView.java')
def celineV65GeneratedDir = file("$buildDir/generated/celineV65/intermediate")
def celineV65Candidate = file("$celineV65GeneratedDir/models/celine.glb")
def celineV65Report = file("$buildDir/reports/celineV65/production-morph.json")
def celineV65Validation = file("$buildDir/reports/celineV65/validation.json")
def celineV75GeneratedAssetsDir = file("$buildDir/generated/celineV75/assets")
def celineV75Candidate = file("$celineV75GeneratedAssetsDir/models/celine.glb")
def celineV75Report = file("$buildDir/reports/celineV75/character-refresh.json")
def celineV75Validation = file("$buildDir/reports/celineV75/validation.json")
def celineCanonicalSource = file('src/main/assets/models/celine-source/Meshy_AI_biped_Character_output.glb')
def celineV65Generator = rootProject.file('ci/celine_production_morph_v65.py')
def celineV65Validator = rootProject.file('ci/celine_facial_morph_validation.py')
def celineV75Generator = rootProject.file('ci/celine_character_refresh_v75.py')
def celineV75Validator = rootProject.file('ci/celine_character_refresh_validation_v75.py')
def celineV75ReferenceManifest = rootProject.file('docs/celine/reference/v2/REFERENCE_MANIFEST.json')

tasks.register('generateCeline3DViewV62') {
    inputs.file(celineV62Source)
    outputs.dir(celineV62GeneratedDir)
    doLast {
        String text = celineV62Source.getText('UTF-8')
        String classAnchor = 'public final class Celine3DView extends FrameLayout {'
        String frameAnchor = '                updateLivePose(frameTimeNanos);'
        String visemeAnchor = '    public void setViseme(SpeechVisemeAnalyzer.Cue cue) {}'
        String homeLensAnchor = '        camera.setLensProjection(32.0, (double) width / (double) height, 0.05, 1000.0);'
        if (!text.contains(classAnchor)) throw new GradleException('v62 source transform: class anchor missing')
        if (!text.contains(frameAnchor)) throw new GradleException('v62 source transform: frame anchor missing')
        if (!text.contains(visemeAnchor)) throw new GradleException('v62 source transform: viseme anchor missing')
        if (!text.contains(homeLensAnchor)) throw new GradleException('v64 HOME lens transform: anchor missing')

        text = text.replace(classAnchor, 'final class Celine3DView extends FrameLayout {')
        text = text.replace(frameAnchor,
                frameAnchor + '\n                CelineMorphRuntimeV62.onFrame(Celine3DView.this, frameTimeNanos);')
        text = text.replace(visemeAnchor,
                '    public void setViseme(SpeechVisemeAnalyzer.Cue cue) { CelineMorphRuntimeV62.onViseme(this, cue); }')
        // HOME presentation is established at 38 mm by v44. Keep the renderer's late
        // Surface/viewport resize on the same lens so CALL -> HOME cannot fall back to 32 mm
        // and make Celine visibly smaller after the stage is reparented.
        text = text.replace(homeLensAnchor,
                '        camera.setLensProjection(38.0, (double) width / (double) height, 0.05, 1000.0);')

        int finalBrace = text.lastIndexOf('\n}')
        if (finalBrace <= 0) throw new GradleException('v62 source transform: final class brace missing')
        String accessors = '''

    Engine v62Engine() { return engine; }
    FilamentAsset v62Asset() { return asset; }
    CelineAvatarController.State v62AvatarState() { return avatarState; }
'''
        text = text.substring(0, finalBrace) + accessors + text.substring(finalBrace)

        File output = new File(celineV62GeneratedDir, 'de/yahya/ai/Celine3DViewV62.java')
        output.parentFile.mkdirs()
        output.setText(text, 'UTF-8')
    }
}


tasks.register('generateCelineProductionMorphV65', Exec) {
    inputs.files(celineCanonicalSource, celineV65Generator)
    outputs.files(celineV65Candidate, celineV65Report)
    doFirst {
        celineV65Candidate.parentFile.mkdirs()
        celineV65Report.parentFile.mkdirs()
    }
    commandLine 'python3',
            celineV65Generator.absolutePath,
            celineCanonicalSource.absolutePath,
            celineV65Candidate.absolutePath,
            '--report', celineV65Report.absolutePath,
            '--expected-sha256', '6e507144afa22f0534be0419884932a0c6aaa16b8b2013580013ffe5056bb146'
}

tasks.register('validateCelineProductionMorphV65', Exec) {
    dependsOn tasks.named('generateCelineProductionMorphV65')
    inputs.files(celineCanonicalSource, celineV65Candidate, celineV65Validator)
    outputs.file(celineV65Validation)
    doFirst { celineV65Validation.parentFile.mkdirs() }
    commandLine 'python3',
            celineV65Validator.absolutePath,
            celineCanonicalSource.absolutePath,
            celineV65Candidate.absolutePath,
            '--report', celineV65Validation.absolutePath
}

tasks.register('generateCelineCharacterRefreshV75', Exec) {
    dependsOn tasks.named('validateCelineProductionMorphV65')
    inputs.files(celineCanonicalSource, celineV65Candidate, celineV75Generator, celineV75ReferenceManifest)
    outputs.files(celineV75Candidate, celineV75Report)
    doFirst {
        celineV75Candidate.parentFile.mkdirs()
        celineV75Report.parentFile.mkdirs()
    }
    commandLine 'python3',
            celineV75Generator.absolutePath,
            celineCanonicalSource.absolutePath,
            celineV65Candidate.absolutePath,
            celineV75Candidate.absolutePath,
            '--report', celineV75Report.absolutePath,
            '--expected-sha256', '7674ab52bdf06bf2e962e2d90474a587e08f2122a60cd8df91787713889b2929'
}

tasks.register('validateCelineCharacterRefreshV75', Exec) {
    dependsOn tasks.named('generateCelineCharacterRefreshV75')
    inputs.files(celineCanonicalSource, celineV65Candidate, celineV75Candidate,
            celineV75Validator, celineV75ReferenceManifest)
    outputs.file(celineV75Validation)
    doFirst { celineV75Validation.parentFile.mkdirs() }
    commandLine 'python3',
            celineV75Validator.absolutePath,
            celineCanonicalSource.absolutePath,
            celineV65Candidate.absolutePath,
            celineV75Candidate.absolutePath,
            celineV75ReferenceManifest.absolutePath,
            '--report', celineV75Validation.absolutePath,
            '--expected-sha256', '7674ab52bdf06bf2e962e2d90474a587e08f2122a60cd8df91787713889b2929'
}

android {
    namespace 'de.yahya.ai'
    compileSdkVersion 30
    defaultConfig {
        applicationId 'de.yahya.ai'
        minSdkVersion 26
        targetSdkVersion 30
        versionCode 75
        versionName '1.0-celin-character-refresh'
    }
    signingConfigs {
        debug {
            storeFile stableDebugKeystore
            storePassword 'yahya-debug'
            keyAlias 'yahya-debug'
            keyPassword 'yahya-debug'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    sourceSets {
        main {
            java.srcDir celineV62GeneratedDir
            java.exclude 'de/yahya/ai/Celine3DView.java'
            assets.srcDir celineV75GeneratedAssetsDir
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateCeline3DViewV62')
    dependsOn tasks.named('validateCelineCharacterRefreshV75')
}

dependencies {
    implementation 'com.github.k2-fsa:sherpa-onnx:v1.13.4'
    implementation 'org.apache.commons:commons-compress:1.21'

    // v75 refreshes only neutral geometry and material appearance from the frozen master
    // references; v74 motion, v70 CALL, v68 keyboard geometry and v66 face runtime stay protected.
    implementation 'com.google.android.filament:filament-android:1.72.0'
    implementation 'com.google.android.filament:gltfio-android:1.72.0'
}
